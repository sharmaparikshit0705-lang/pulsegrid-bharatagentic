/* ================================================================
   PULSEGRID — single-file CodePen build
   React 18 + Chart.js 4 + Tailwind (Play CDN) + Babel Standalone
   Mock API included — open the console to watch payload exchanges.
   ================================================================ */

const { useState, useEffect, useRef, useCallback, useMemo } = React;

function createSubscribableRuntime({ speed = 1 } = {}) {
  const listeners = new Set();
  const rt = createRuntime({ speed, onEvent: (e) => listeners.forEach((fn) => fn(e)) });
  return {
    ...rt,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
  };
}


/* ---------- in-browser mock API (mirrors the Express /server contract) ---------- */

const { api, isGreenLaneWindow } = (() => {
/**
 * PulseGrid API client with an in-browser mock transport.
 *
 * Every function here mirrors a real endpoint on the Express server in
 * /server. When VITE_USE_MOCKS=false the same functions issue real fetch()
 * calls against VITE_API_BASE — the calling components never change.
 *
 * Mock transport simulates network latency and logs the request/response
 * payloads to the browser console so the payload exchange is inspectable.
 */

const API_BASE = '/api/v1';
const USE_MOCKS = true;

/* ------------------------------ helpers ------------------------------ */

const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const HOUR = 3_600_000;
const MIN = 60_000;

const CORRIDOR_SPOTS = [
  { label: 'Avinashi Rd · Hope College Junction', lat: 11.0126, lng: 76.9643 },
  { label: 'Avinashi Rd · Peelamedu (PSG Tech gate)', lat: 11.0168, lng: 76.9558 },
  { label: 'Avinashi Rd · Codissia Junction', lat: 11.0256, lng: 76.9467 },
  { label: 'Avinashi Rd · KMCH Junction', lat: 11.0311, lng: 76.9386 },
  { label: 'Avinashi Rd · Neelambur (PSG iTech)', lat: 11.0523, lng: 76.9204 },
  { label: 'Saravanampatti Rd · Kalapatti Junction', lat: 11.0462, lng: 76.9855 },
  { label: 'Saravanampatti Rd · KGISPT IT Park', lat: 11.0868, lng: 76.9989 },
  { label: 'Saravanampatti · 4-Roads Junction', lat: 11.0965, lng: 77.0013 },
];

const DAMAGE_TYPES = [
  'Pothole',
  'Alligator Cracking',
  'Longitudinal Cracking',
  'Edge Break',
  'Rutting',
  'Patched Surface Failure',
];

const RECOMMENDED_ACTIONS = {
  1: 'Log only — monitor across next edge scans.',
  2: 'Queue for routine maintenance within the monthly cycle.',
  3: 'Cold-mix patch within SLA (24h). Notify CCMC ward engineer.',
  4: 'Hot-mix patch within SLA. Cone off lane; prioritise repair crew.',
  5: 'Immediate hazard. Dispatch crew now + traffic diversion (cc: traffic police).',
};

/* ------------------------- mock Vision AI analysis ------------------------- */

function mockVisionAnalysis(overrides = {}) {
  const hasPothole = overrides.hasPothole ?? Math.random() > 0.12;
  if (!hasPothole) {
    return {
      hasPothole: false,
      severityScore: 1,
      damageType: 'No significant defect detected',
      recommendedAction: 'No action required. Surface within tolerance.',
      confidence: +rand(0.86, 0.97).toFixed(2),
      model: 'pulsegrid-vision-v1',
    };
  }
  const severityScore = overrides.severityScore ?? randInt(2, 5);
  return {
    hasPothole: true,
    severityScore,
    damageType: overrides.damageType ?? pick(DAMAGE_TYPES),
    recommendedAction: RECOMMENDED_ACTIONS[severityScore],
    estimatedSizeCm: overrides.sizeCm ?? randInt(15, 90),
    confidence: +rand(0.83, 0.98).toFixed(2),
    model: 'pulsegrid-vision-v1',
  };
}

/* ----------------------------- mock stores ----------------------------- */

let idSeq = 1000;
const nextId = () => ++idSeq;

function seedDiagnostics() {
  const t = Date.now();
  const mk = (hoursAgo, severity, source, status, spot) => ({
    id: nextId(),
    ...spot,
    severity_score: severity,
    image_url: `s3://pulsegrid-media/diagnostics/${source.toLowerCase()}-${nextId()}.jpg`,
    source_type: source,
    status,
    created_at: new Date(t - hoursAgo * HOUR).toISOString(),
    sla_due_at: new Date(t - hoursAgo * HOUR + 24 * HOUR).toISOString(),
    dispatch_ticket: status !== 'PENDING' ? `CCMC-WRD-${randInt(4000, 5999)}` : null,
    size_cm: randInt(20, 85),
    ai_confidence: +rand(0.85, 0.97).toFixed(2),
  });
  return [
    mk(0.2, 4, 'BUS_DASHCAM', 'DISPATCHED', CORRIDOR_SPOTS[1]),
    mk(1.4, 3, 'CITIZEN_UPLOAD', 'PENDING', CORRIDOR_SPOTS[5]),
    mk(3.1, 2, 'BUS_DASHCAM', 'REPAIRED', CORRIDOR_SPOTS[0]),
    mk(9.6, 4, 'CITIZEN_UPLOAD', 'DISPATCHED', CORRIDOR_SPOTS[3]),
    mk(22.8, 5, 'BUS_DASHCAM', 'REPAIRED', CORRIDOR_SPOTS[6]),
    mk(30.2, 3, 'CITIZEN_UPLOAD', 'REPAIRED', CORRIDOR_SPOTS[2]),
  ];
}

function seedSignals() {
  const t = Date.now();
  const junctions = [
    { signal_id: 'J-HOPE', junction_name: 'Hope College Junction', corridor: 'Avinashi Rd', lat: 11.0126, lng: 76.9643 },
    { signal_id: 'J-PEEL', junction_name: 'Peelamedu (PSG Tech)', corridor: 'Avinashi Rd', lat: 11.0168, lng: 76.9558 },
    { signal_id: 'J-CODI', junction_name: 'Codissia Junction', corridor: 'Avinashi Rd', lat: 11.0256, lng: 76.9467 },
    { signal_id: 'J-KMCH', junction_name: 'KMCH Junction', corridor: 'Avinashi Rd', lat: 11.0311, lng: 76.9386 },
    { signal_id: 'J-NEEL', junction_name: 'Neelambur Junction', corridor: 'Avinashi Rd', lat: 11.0523, lng: 76.9204 },
    { signal_id: 'J-KALA', junction_name: 'Kalapatti Junction', corridor: 'Saravanampatti Rd', lat: 11.0462, lng: 76.9855 },
    { signal_id: 'J-KGIS', junction_name: 'KGISPT IT Park', corridor: 'Saravanampatti Rd', lat: 11.0868, lng: 76.9989 },
    { signal_id: 'J-SARA', junction_name: 'Saravanampatti 4-Roads', corridor: 'Saravanampatti Rd', lat: 11.0965, lng: 77.0013 },
  ];
  return junctions.map((j, i) => ({
    ...j,
    current_phase: 'GREEN_WAVE',
    vehicle_count: randInt(24, 88),
    avg_speed_kmh: +rand(14, 38).toFixed(1),
    updated_at: new Date(t).toISOString(),

    { bus_id: 'PG-CB-101', route_code: 'PSG-AVN', serve: 'PSG College of Technology' },
    { bus_id: 'PG-CB-102', route_code: 'CIT-AVN', serve: 'Coimbatore Institute of Technology' },
    { bus_id: 'PG-CB-103', route_code: 'PSGI-SVP', serve: 'PSG iTech (Neelambur)' },
    { bus_id: 'PG-CB-104', route_code: 'KG-SVP', serve: 'KG College / KGISPT staff' },
    { bus_id: 'PG-CB-105', route_code: 'SCH-TRIP', serve: 'Saravanampatti school cluster' },
    { bus_id: 'PG-CB-106', route_code: 'PSGI-SVP', serve: 'PSG iTech (evening run)' },
  ].map((b, i) => ({
    ...b,

  const evs = [

    ...b,

function seedViolations() {
  const t = Date.now();
  const mk = (minsAgo, spot) => ({

const db = {
  diagnostics: [],
  signals: [],
  fleet: [],
  violations: [],
  waitingAtHubs: [
    { hub: 'KGISPT IT Park gate', waiting: 23 },
    { hub: 'Saravanampatti 4-Roads', waiting: 31 },

  ],
  emergency: { active: false, reason: null, activated_at: null },
};

  db.diagnostics = seedDiagnostics();
  db.signals = seedSignals();
  db.fleet = seedFleet();
  db.violations = seedViolations();
  db.emergency = { active: false, reason: null, activated_at: null };
}
resetMockStores();

/* --------------------------- mock transport ---------------------------- */

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function mockTransport(method, path, body) {
  const latency = randInt(220, 700);
  console.info(
    `%c→ ${method} ${path}`,
    'color:#00F0FF;font-weight:bold',
    body ? { request: body } : ''
  );
  await sleep(latency);
  const result = routeMock(method, path, body);
  console.info(
    `%c← 200 ${path}`,
    'color:#00FF66;font-weight:bold',
    { response: result }
  );
  return structuredClone(result);
}

async function httpTransport(method, path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

function request(method, path, body) {
  return USE_MOCKS
    ? mockTransport(method, path, body)
    : httpTransport(method, path, body);
}

function findSignal(junctionId) {
  const s = db.signals.find((x) => x.signal_id === junctionId);
  if (!s) throw new Error(`Unknown junction: ${junctionId}`);
  return s;
}

/** Advance signal phases based on elapsed wall-clock time, drift counts. */
function tickSignals() {
  for (const s of db.signals) {
    if (s.current_phase === 'EMERGENCY_OVERRIDE') continue;
    s.phase_ends_in_s -= 1;
    s.vehicle_count = clamp(s.vehicle_count + randInt(-3, 4), 8, 140);
    s.avg_speed_kmh = +clamp(s.avg_speed_kmh + rand(-1.4, 1.2), 9, 52).toFixed(1);
    s.updated_at = new Date().toISOString();
    if (s.phase_ends_in_s <= 0) {
      if (s.current_phase === 'GREEN_WAVE') {
        s.current_phase = 'TRANSIT_PRIORITY';
        s.phase_ends_in_s = randInt(12, 25);
      } else {
        s.current_phase = 'GREEN_WAVE';
        s.phase_ends_in_s = randInt(30, 48);
      }
    }
  }
}

function routeMock(method, path, body) {
  const P = (re) => re.exec(path);

  /* ---------- diagnostics ---------- */
  if (method === 'GET' && path === '/diagnostics') {
    tickSignals();
    return { diagnostics: db.diagnostics, count: db.diagnostics.length };
  }

  if (method === 'POST' && path === '/diagnostics/citizen-report') {
    const vision = mockVisionAnalysis({
      damageType: body.damageTypeHint,
      hasPothole: body.hasPhoto ? undefined : Math.random() > 0.2,
    });
    const spot = CORRIDOR_SPOTS.find((s) => Math.abs(s.lat - body.lat) < 0.01) ||
      { label: `Geotagged @ ${body.lat.toFixed(4)}, ${body.lng.toFixed(4)}`, lat: body.lat, lng: body.lng };
    const diag = {
      id: nextId(),
      ...spot,
      severity_score: vision.hasPothole ? vision.severityScore : 1,
      image_url: `s3://pulsegrid-media/diagnostics/citizen-${nextId()}.jpg`,
      source_type: 'CITIZEN_UPLOAD',
      status: 'PENDING',
      created_at: new Date().toISOString(),
      sla_due_at: new Date(Date.now() + 24 * HOUR).toISOString(),
      dispatch_ticket: null,
      size_cm: vision.estimatedSizeCm ?? randInt(15, 70),
      ai_confidence: vision.confidence,
    };
    db.diagnostics.unshift(diag);
    return { diagnostic: diag, vision_analysis: vision };
  }

  if (method === 'POST' && path === '/diagnostics/edge-scan') {
    if (body.speed_kmh >= 60) {
      const err = new Error('Frame rejected: capture is only valid below 60 km/h');
      err.status = 422;
      throw err;
    }
    const vision = mockVisionAnalysis();
    const diag = {
      id: nextId(),
      label: `${body.camera_id ?? 'EDGE-CAM'} · ${body.lat.toFixed(4)}, ${body.lng.toFixed(4)}`,
      lat: body.lat,
      lng: body.lng,
      severity_score: vision.hasPothole ? vision.severityScore : 1,
      image_url: `s3://pulsegrid-media/diagnostics/edge-${nextId()}.jpg`,
      source_type: 'BUS_DASHCAM',
      status: vision.hasPothole && vision.severityScore >= 3 ? 'DISPATCHED' : 'PENDING',
      created_at: new Date().toISOString(),
      sla_due_at: new Date(Date.now() + 24 * HOUR).toISOString(),
      dispatch_ticket: vision.hasPothole && vision.severityScore >= 3 ? `CCMC-WRD-${randInt(4000, 5999)}` : null,
      size_cm: vision.estimatedSizeCm ?? randInt(15, 70),
      ai_confidence: vision.confidence,
    };
    if (diag.status === 'DISPATCHED') {
      diag.auto_dispatch = { repair_crew: 'CCMC Ward-32 road crew', eta_min: randInt(45, 180) };
    }
    db.diagnostics.unshift(diag);
    return { diagnostic: diag, vision_analysis: vision };
  }

  const mDiag = P(/^\/diagnostics\/(\d+)\/status$/);
  if (method === 'PATCH' && mDiag) {
    const diag = db.diagnostics.find((d) => d.id === +mDiag[1]);
    if (!diag) throw new Error('Diagnostic not found');
    diag.status = body.status;
    if (body.status === 'REPAIRED') diag.repaired_at = new Date().toISOString();
    return { diagnostic: diag };
  }

  /* ---------- signals ---------- */
  if (method === 'GET' && path === '/signals') {
    tickSignals();
    return { signals: db.signals };
  }

  const mSig = P(/^\/signals\/adaptive-status\/([A-Za-z0-9-]+)$/);
  if (method === 'GET' && mSig) {
    tickSignals();
    const s = findSignal(mSig[1]);
    const recommendedExtension = Math.min(
      30,
      Math.max(0, Math.floor(s.vehicle_count / 4) * 5 + (s.avg_speed_kmh < 18 ? 8 : 0))
    );
    return {
      signal: s,
      density: { vehicles: s.vehicle_count, queue_m: s.vehicle_count * 6.2, avg_speed_kmh: s.avg_speed_kmh },
      recommendation: {
        recommended_green_extension_s: recommendedExtension,
        rationale:
          s.avg_speed_kmh < 18
            ? 'Approach speed below free-flow threshold; transit priority advised.'
            : 'Density within green-wave envelope; hold coordinated offset.',
      },
    };
  }

  const mExt = P(/^\/signals\/([A-Za-z0-9-]+)\/extend-green$/);
  if (method === 'POST' && mExt) {
    const s = findSignal(mExt[1]);
    s.green_extension_s += body.seconds ?? 10;
    s.phase_ends_in_s += body.seconds ?? 10;
    s.current_phase = 'TRANSIT_PRIORITY';
    s.updated_at = new Date().toISOString();
    return { signal: s, applied_extension_s: body.seconds ?? 10 };
  }

  const mCyc = P(/^\/signals\/([A-Za-z0-9-]+)\/cycle-phase$/);
  if (method === 'POST' && mCyc) {
    const s = findSignal(mCyc[1]);
    s.current_phase = s.current_phase === 'GREEN_WAVE' ? 'TRANSIT_PRIORITY' : 'GREEN_WAVE';
    s.phase_ends_in_s = s.current_phase === 'GREEN_WAVE' ? randInt(30, 48) : randInt(12, 25);
    s.updated_at = new Date().toISOString();
    return { signal: s };
  }

  if (method === 'POST' && path === '/signals/emergency-override') {
    const activate = body.active !== false;
    db.emergency = {
      active: activate,
      reason: activate ? body.reason || 'Operator initiated' : null,
      activated_at: activate ? new Date().toISOString() : null,
    };
    for (const s of db.signals) {
      if (activate) {
        s._previous_phase = s.current_phase;
        s.current_phase = 'EMERGENCY_OVERRIDE';
      } else {
        s.current_phase = s._previous_phase || 'GREEN_WAVE';
      }
      s.updated_at = new Date().toISOString();
    }
    return {
      emergency: db.emergency,
      affected_signals: db.signals.length,
      override_window_s: 120,
    };
  }

  /* ---------- transit / green lane ---------- */
  if (method === 'GET' && path === '/transit/green-lane-violations') {
    return {
      violations: [...db.violations].sort((a, b) => new Date(b.detected_at) - new Date(a.detected_at)),
      fines_issued_today: db.violations.length,
      total_fine_amount: db.violations.length * 2000,
    };
  }

  if (method === 'POST' && path === '/transit/green-lane-sweep') {
    const added = [];
    const n = randInt(1, 2);
    for (let i = 0; i < n; i++) {
      const v = {
        id: nextId(),
        vehicle_reg: `TN 37 ${pick(['B', 'C', 'J'])} ${randInt(1000, 9999)}`,
        vehicle_type: pick(['Private car', 'Auto rickshaw', 'Two-wheeler', 'Commercial van']),
        camera_id: `CAM-GL-0${randInt(1, 6)} · side-mounted`,
        ...pick(CORRIDOR_SPOTS),
        detected_at: new Date().toISOString(),
        lane: 'GREEN LANE',
        fine_amount: 2000,
        status: 'NOTICE ISSUED',
        evidence_clip: `s3://pulsegrid-media/violations/gl-${nextId()}.mp4`,
      };
      db.violations.unshift(v);
      added.push(v);
    }
    return { new_violations: added, total_fines_today: db.violations.length * 2000 };
  }

  if (method === 'GET' && path === '/transit/fleet') {
    return { fleet: db.fleet, waiting_at_hubs: db.waitingAtHubs };
  }

  const mCap = P(/^\/transit\/fleet\/([A-Za-z0-9-]+)\/recalculate-capacity$/);
  if (method === 'POST' && mCap) {
    const affected = db.fleet.filter((b) => b.bus_type === 'PUBLIC_EV');
    for (const bus of affected) {
      bus.occupancy_percentage = clamp(bus.occupancy_percentage + randInt(-12, 26), 5, 100);
      bus.eta_next_stop_min = randInt(2, 11);
    }
    let absorbed = 0;
    for (const hub of db.waitingAtHubs) {
      const take = Math.min(hub.waiting, randInt(0, 14));
      hub.waiting -= take;
      absorbed += take;
    }
    return {
      route_code: 'PG-EV-LOOP',
      buses: affected,
      passengers_absorbed: absorbed,
      waiting_at_hubs: db.waitingAtHubs,
      recommendation:
        absorbed > 40
          ? 'Surge detected on Saravanampatti corridor — dispatch reserve EV bus PG-EV-207 from Ukkadam depot.'
          : 'Capacity sufficient. No reserve bus required this cycle.',
      computed_at: new Date().toISOString(),
    };
  }

  const mDisp = P(/^\/transit\/fleet\/([A-Za-z0-9-]+)\/dispatch$/);
  if (method === 'POST' && mDisp) {
    const bus = db.fleet.find((b) => b.bus_id === mDisp[1]);
    if (!bus) throw new Error('Bus not found');
    bus.status = 'EN ROUTE';
    bus.next_departure = new Date(Date.now() + 1 * MIN).toISOString();
    bus.occupancy_percentage = clamp(bus.occupancy_percentage + randInt(10, 30), 10, 100);
    return { bus, dispatched: true };
  }

  throw new Error(`No mock route: ${method} ${path}`);
}

const pad = (n) => String(n).padStart(2, '0');

/** Live HH:MM:SS countdown toward an ISO deadline. */
function CountdownTimer({ dueAt, breachedText = 'SLA BREACHED — ESCALATED' }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  const remaining = new Date(dueAt).getTime() - now;
  if (remaining <= 0) {
    return <span className="font-mono text-[11px] font-bold text-rose-400 animate-pulse">{breachedText}</span>;
  }
  const h = Math.floor(remaining / 3_600_000);
  const m = Math.floor((remaining % 3_600_000) / 60_000);
  const s = Math.floor((remaining % 60_000) / 1000);
  const tone = h > 12 ? 'text-cyan-300' : h > 3 ? 'text-amber-300' : 'text-rose-400 animate-pulse';
  return (
    <span className={`font-mono text-[11px] font-bold ${tone}`}>
      {pad(h)}:{pad(m)}:{pad(s)}
    </span>
  );
}

function formatTime(iso) {
  const d = new Date(iso);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function timeAgo(iso) {
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ago`;
}

 * PulseGrid agent core — corridor world model.
 *
 * Static, deterministic data describing the Coimbatore–Kochi freight/mobility
 * corridor: the road graph, cold-chain facilities, rest facilities, commodities,
 * signalised junctions, drivers and known crash hotspots.

/* ----------------------------- seeded RNG ----------------------------- */
/** Deterministic PRNG (mulberry32) so every agent run is reproducible. */
function makeRng(seed = 42) {
  let a = seed >>> 0;
  return function rng() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ------------------------------- helpers ------------------------------- */
function pathBetween(edges, from, to) {
  // Small graph — exhaustive simple-path search is fine at this scale.
  const paths = [];
  const walk = (node, acc, visited) => {
    if (node === to) {
      paths.push([...acc]);
      return;
    }
    for (const e of edges) {
      if (e.from === node && !visited.has(e.to)) {
        visited.add(e.to);
        walk(e.to, [...acc, e], visited);
        visited.delete(e.to);
      }
    }
  };
  walk(from, [], new Set([from]));
  return paths;
}

function summarisePath(path) {
  return {
    nodes: [path[0].from, ...path.map((e) => e.to)],
    via: path.map((e) => e.via).join(' → '),
    distanceKm: path.reduce((a, e) => a + e.distanceKm, 0),
    driveMinutes: path.reduce((a, e) => a + e.driveMinutes, 0),
    tollInr: path.reduce((a, e) => a + e.tollInr, 0),
    hazardsCrossed: [...new Set(path.flatMap((e) => e.crosses))],
  };
}

function haversineKm(a, b) {
  const R = 6371;
  const dLat = ((b.lat - a.lat) * Math.PI) / 180;
  const dLng = ((b.lng - a.lng) * Math.PI) / 180;
  const s =
    Math.sin(dLat / 2) ** 2 +
    Math.cos((a.lat * Math.PI) / 180) * Math.cos((b.lat * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
  return +(2 * R * Math.asin(Math.sqrt(s))).toFixed(1);
}

 * into the active run so the whole chain is replayable.

/* ------------------------------ utilities ------------------------------ */
function sha256Hex(input) {
  // Small, dependency-free FNV-1a based digest stand-in (labelled as such).
  let h1 = 0x811c9dc5;
  let h2 = 0x01000193;
  const s = typeof input === 'string' ? input : JSON.stringify(input);
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0;
  }
  return (h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0')).repeat(4).slice(0, 64);
}

  vision_analyze_road_damage: {

    run({ frameId = 'frame', speedKmh = 50, seed = 7 } = {}) {
      if (speedKmh >= 60) {

      const rng = makeRng(seed);

        model: 'pulsegrid-vision-v1 (simulated response)',

  },

  rsl_model: {
    id: 'rsl_model',
    description: 'Remaining Shelf Life: base shelf life minus temperature-band decay.',
    simulated: false,
    run({ commodity, elapsedH = 0, tempTrace = [], ambientC = 30 } = {}) {
      const c = COMMODITIES[commodity];
      if (!c) return { ok: false, error: `Unknown commodity ${commodity}` };
      const [lo, hi] = c.toleranceC;
      let breachMinutes = 0;
      let degreeHours = 0;
      for (const t of tempTrace) {
        if (t.tempC > hi) {
          breachMinutes += t.minutes;
          degreeHours += (t.tempC - hi) * (t.minutes / 60);
        } else if (t.tempC < lo) {
          breachMinutes += t.minutes;
          degreeHours += (lo - t.tempC) * (t.minutes / 60);
        }
      }
      const decayMultiplier = +(1 + c.decayPerDegreeAboveBand * degreeHours).toFixed(2);
      const consumed = elapsedH * decayMultiplier;
      const rslRemainingH = Math.max(0, +(c.baseShelfLifeHours - consumed).toFixed(1));
      const rslDays = +(rslRemainingH / 24).toFixed(1);
      return {
        ok: true,
        commodity,
        toleranceC: c.toleranceC,
        baseShelfLifeH: c.baseShelfLifeHours,
        elapsedH,
        breachMinutes,
        degreeHoursOutOfBand: +degreeHours.toFixed(2),
        decayMultiplier,
        rslRemainingH,
        rslDays,
        toleranceBreach: breachMinutes > 0,
      };
    },
  },

/* ------------------------- instrumented registry ------------------------ */
/**
 * Wrap the registry so every call lands in the active run's trace.
 * `recorder` is supplied by the orchestrator per run.
 */
function makeToolkit(recorder, { latency = 0, onEvent } = {}) {
  const kit = {};
  for (const [name, tool] of Object.entries(TOOLS)) {
    kit[name] = async (args = {}) => {
      const startedAt = Date.now();
      onEvent?.({ type: 'tool_call', tool: name, args, at: startedAt });
      const result = tool.run(args);
      const elapsedMs = latency || Math.max(6, (Date.now() - startedAt) % 40);
      const record = {
        tool: name,
        args,
        ok: result?.ok !== false,
        result,
        simulated: Boolean(tool.simulated),
        elapsedMs,
        at: new Date().toISOString(),
      };
      recorder?.push(record);
      onEvent?.({ type: 'tool_result', tool: name, result, simulated: Boolean(tool.simulated), elapsedMs });
      return result;
    };
  }
  kit.__registry = TOOLS;
  return kit;
}

const toolCatalog = Object.values(TOOLS).map((t) => ({
  id: t.id,
  description: t.description,
  simulated: Boolean(t.simulated),
}));

/**
 * PulseGrid agent core — request router.
 *
 * Turns a free-form request (what a dispatcher, a municipal officer or a judge
 * would type) into an execution plan: which specialist agents to run, in what
 * order, and with what inputs.
 *
 * This is a deterministic, inspectable rule-based router — no model call, so it
 * is reproducible, auditable and free to run. It reports its own confidence and
 * says so when it cannot tell what is being asked, rather than guessing.
 */
/* Intent signals. Each intent maps to the agents that can act on it. */
const SIGNALS = [
  {
    intent: 'road_defect',

  {

    label: 'Driver fatigue / welfare',

  },
  {

    label: 'Emissions / greener mode',

    keywords: ['carbon', 'emission', 'green', 'co2', 'sustainability', 'fuel', 'rail instead', 'modal'],

  },
];

/* Execution order: produce information before consuming it.
   reroute changes the ETA, so it must precede coldguard. */
const RANK = {
  corridorsense: 1,
  reroute: 1,
  safetysentinel: 2,
  coldguard: 2,
  saarthi: 2,
  greenlane: 3,
  hubsync: 3,
  trustledger: 4,
};

/** Default inputs per agent, overridable by the caller's `context`. */
function inputsFor(agentId, context) {
  const shipment = context.shipment || SHIPMENTS['S-4471'];
  const position = context.position || { lat: 10.9, lng: 76.7 };
  const driverId = context.driverId || 'D-3310';
  const map = {
    corridorsense: {
      frame: context.frame || {
        frameId: 'REQ-FRAME-01',
        vehicleId: context.vehicleId || 'TN-37-BUS-2214',
        lat: context.lat ?? 11.0168,
        lng: context.lng ?? 76.9558,
        seed: context.seed ?? 11,
      },
      speedKmh: context.speedKmh ?? 52,
    },
    reroute: { shipment, driverId, language: context.language || DRIVERS[driverId]?.language || 'en-IN' },
    coldguard: {
      shipment,
      telemetry: context.telemetry || [
        { minutes: 5, tempC: 5.2, doorOpen: false },
        { minutes: 5, tempC: 5.1, doorOpen: false },
        { minutes: 5, tempC: 5.4, doorOpen: false },
        { minutes: 5, tempC: 5.0, doorOpen: false },
        { minutes: 5, tempC: 5.3, doorOpen: false },
      ],
      elapsedH: context.elapsedH ?? 3.3,
      etaMinutes: context.etaMinutes ?? 210,
      ambientC: context.ambientC ?? 33,
      position,
    },
    safetysentinel: {
      mode: 'emergency',
      ambulance: context.ambulance || { id: 'AMB-108-04', destination: 'KMCH Junction', corridorId: 'CBE-AVINASHI' },
      junctions: context.junctions || CORRIDOR_JUNCTIONS.slice(0, 8),
    },
    saarthi: { driverId, position },
    greenlane: { shipment, distanceKm: context.distanceKm ?? 190 },
    hubsync: { shipment },
    trustledger: {
      subjectType: context.subjectType || 'agent_decision',
      subjectId: shipment.id,
      payload: { request: context.request || null },
      contractId: shipment.contractId,
      clause: 'service_notice',
    },
  };
  // Return only the inputs the requested agent needs — not the whole map.
  return map[agentId] || {};
}

/**
 * Classify a free-form request and produce an execution plan.
 * @returns {{intents: Array, tasks: Array, rationale: string, confidence: number, needsClarification: boolean}}
 */
function planRequest(request, context = {}) {
  const text = String(request || '').toLowerCase();
  const matched = SIGNALS.filter((s) => s.keywords.some((k) => text.includes(k)));

  const intents = matched.map((m) => ({ intent: m.intent, label: m.label, agents: m.agents }));

  // Collect the union of agents, then order them by dependency rank.
  const wanted = new Set(matched.flatMap((m) => m.agents));
  // Nothing matched: fall back to the safety-first default rather than doing nothing.
  if (wanted.size === 0) wanted.add('corridorsense');
  // Evidence anchoring is worth doing whenever the plan takes more than one action.
  if (wanted.size >= 2) wanted.add('trustledger');

  const tasks = [...wanted]
    .sort((a, b) => (RANK[a] ?? 9) - (RANK[b] ?? 9))
    .map((agentId) => ({ agent: agentId, input: (carry) => inputsFor(agentId, { ...context, ...carry, request }) }));

  const confidence = matched.length === 0 ? 0.25 : Math.min(0.95, 0.5 + matched.length * 0.15);

  const rationale = matched.length
    ? `Matched ${matched.length} intent${matched.length > 1 ? 's' : ''} (${matched.map((m) => m.intent).join(', ')}) → dispatching ${tasks.length} agent${tasks.length > 1 ? 's' : ''} in dependency order.`
    : 'No intent matched confidently. Falling back to the safety-first default (CorridorSense) and asking for clarification.';

  return {
    intents,
    tasks,
    rationale,
    confidence,
    needsClarification: matched.length === 0,
    matchedKeywords: matched.flatMap((m) => m.keywords.filter((k) => text.includes(k))),
  };
}

/** The catalogue of intents, so the API can document what it understands. */
const INTENTS = SIGNALS.map((s) => ({ intent: s.intent, label: s.label, agents: s.agents, keywords: s.keywords }));

/**
 * PulseGrid agent core — the eight specialist agents.
 *
 * Each agent implements the same loop: perceive → fuse → reason → plan →
 * act (scoped) → verify → learn. Agents reason with real (if simulated)
 * numbers: they compare costed options, apply thresholds, respect guardrails
 * and return an auditable decision object.
 *
 * ctx provides: tools (instrumented registry), memory, step(), emit().
 */

const inr = (n) => `₹${Math.round(n).toLocaleString('en-IN')}`;
const min = (m) => `${Math.round(m)} min`;

/* ===================================================================== */
/* 1. CorridorSense — road-state digital twin & defect → SLA loop         */
/* ===================================================================== */
const CorridorSense = {
  id: 'corridorsense',
  name: 'CorridorSense',
  purpose: 'Keeps the corridor digital twin current: detects surface defects and drives the municipal repair SLA.',
  toolsUsed: ['vision_analyze_road_damage', 'hotspot_score', 'postgis_upsert_defect', 'open_sla_ticket', 'publish_advisory', 'anchor_proof'],
  guardrails: ['Severity ≥ 4 or school proximity requires human confirmation before a public hazard advisory'],

  async run({ frame, speedKmh = 52 }, ctx) {
    const { tools, step, memory } = ctx;

    step('perceive', 'Dashcam frame ingested', `${frame.frameId} · vehicle ${frame.vehicleId} · ${speedKmh} km/h (capture gate < 60)`);
    const vision = await tools.vision_analyze_road_damage({ frameId: frame.frameId, speedKmh, seed: frame.seed ?? 11 });
    if (!vision.ok) {
      step('reason', 'Frame discarded', vision.error);
      return { summary: 'Frame rejected at the edge gate', confidence: 1, actions: [], requiresApproval: false };
    }
    step('fuse', 'Vision AI verdict', `${vision.damageType} · severity ${vision.severityScore}/5 · ${vision.estimatedSizeCm} cm · confidence ${vision.confidence}`);
    if (!vision.hasPothole) {
      step('reason', 'No actionable defect', 'Surface within tolerance — nothing to dispatch.');
      return { summary: 'No defect above threshold', confidence: vision.confidence, actions: [], requiresApproval: false };
    }

    const risk = await tools.hotspot_score({ lat: frame.lat, lng: frame.lng });
    step('fuse', 'Context fused', `crash-risk score ${risk.score}/100 · nearest cluster ${risk.nearestHotspot?.label ?? 'none'} · school nearby: ${risk.schoolNearby}`);

    // Reasoning: escalate above the default SLA when severity or context warrants it.
    const escalate = vision.severityScore >= 4 || risk.schoolNearby;
    const prior = memory.get('defect_prior') || 0;
    const effectiveSeverity = Math.min(5, vision.severityScore + (risk.schoolNearby && vision.severityScore >= 3 ? 1 : 0));
    step(
      'reason',
      'Severity decision',
      `base ${vision.severityScore}${risk.schoolNearby && vision.severityScore >= 3 ? ' +1 (school proximity)' : ''} → effective ${effectiveSeverity}/5 · ` +
        `${escalate ? 'escalated above default SLA' : 'within default SLA'} · learned prior on this stretch: ${prior}`
    );

    step('plan', 'Plan', escalate
      ? 'Open ticket, publish a temporary hazard advisory, anchor the evidence, confirm with the ward engineer.'
      : 'Open ticket with the standard SLA and anchor the evidence.');

    const defect = await tools.postgis_upsert_defect({
      lat: frame.lat,
      lng: frame.lng,
      severityScore: effectiveSeverity,
      damageType: vision.damageType,
      sizeCm: vision.estimatedSizeCm,
      sourceType: 'BUS_DASHCAM',
    });
    step('act', 'Defect written to twin', `${defect.defect.id} · status ${defect.defect.status}`);

    const ticket = await tools.open_sla_ticket({ defectId: defect.defect.id, severityScore: effectiveSeverity });
    step('act', 'Municipal ticket raised', `${ticket.ticketId} · SLA ${ticket.slaHours}h · crew ${ticket.crew}`);

    let advisory = null;
    if (escalate) {
      advisory = await tools.publish_advisory({
        corridor: 'CBE-AVINASHI',
        message: `${vision.damageType} (${vision.estimatedSizeCm} cm) detected — proceed with caution`,
        severity: 'high',
      });
      step('act', 'Hazard advisory published', `${advisory.advisoryId} (pending ward-engineer confirmation)`);
    }

    const proof = await tools.anchor_proof({
      subjectType: 'road_defect',
      subjectId: defect.defect.id,
      payload: { vision, ticket: ticket.ticketId, lat: frame.lat, lng: frame.lng },
    });
    step('act', 'Evidence anchored', `${proof.sha256.slice(0, 16)}… · tx ${proof.txId}`);

    step('verify', 'Verification', `Ticket ${ticket.ticketId} open with a live SLA clock; image hash is immutable and re-checkable.`);
    memory.set('defect_prior', prior + 1);
    step('learn', 'Memory updated', `Defect prior for this stretch: ${prior} → ${prior + 1}`);

    return {
      summary: `${vision.damageType} s${effectiveSeverity} → ticket ${ticket.ticketId} (SLA ${ticket.slaHours}h)`,
      confidence: vision.confidence,
      actions: ['postgis_upsert_defect', 'open_sla_ticket', ...(advisory ? ['publish_advisory'] : []), 'anchor_proof'],
      requiresApproval: Boolean(advisory),
      approval: advisory
        ? { reason: `Publish hazard advisory on Avinashi Rd (severity ${effectiveSeverity}, school within 300 m)`, risk: 'public-facing' }
        : null,
      metrics: { severity: effectiveSeverity, slaHours: ticket.slaHours, riskScore: risk.score },
    };
  },
};

/* 2. SafetySentinel — hotspot prevention & emergency corridor pre-emption */
/* ===================================================================== */
const SafetySentinel = {
  id: 'safetysentinel',
  name: 'SafetySentinel',
  purpose: 'Predicts crash hotspots and protects emergency vehicles and vulnerable road users.',
  toolsUsed: ['hotspot_score', 'signal_preempt', 'publish_advisory'],
  guardrails: ['Signal pre-emption is auto-released after the vehicle clears', 'Speed-limit changes require municipal approval'],

  async run({ mode = 'emergency', ambulance = null, junctions = [] }, ctx) {
    const { tools, step } = ctx;

    if (mode === 'emergency') {
      step('perceive', 'Emergency vehicle inbound', `${ambulance.id} → ${ambulance.destination} · ${junctions.length} signalised junctions ahead`);
      const density = junctions.reduce((a, j) => a + j.density, 0) / Math.max(1, junctions.length);
      step('fuse', 'Corridor density', `mean density ${density.toFixed(0)} vehicles/junction · mixed-traffic signal delay ≈ 55 s/junction`);
      const safeToPreempt = density < 95;
      step(
        'reason',
        'Pre-emption decision',
        safeToPreempt
          ? 'Corridor hold is safe at current density; pre-emption saves ~55 s per junction with no cross-corridor starvation risk.'
          : 'Density too high — pre-emption would starve cross corridors. Escalating to manual control.'
      );
      if (!safeToPreempt) {
        return { summary: 'Pre-emption withheld — density too high', confidence: 0.7, actions: [], requiresApproval: true, approval: { reason: 'Corridor too dense for automatic pre-emption', risk: 'safety-critical' } };
      }

      step('plan', 'Plan', `Clear ${junctions.length} junctions on the ambulance corridor, hold service lane, auto-release on clearance.`);
      const pre = await tools.signal_preempt({ junctions, reason: 'ambulance' });
      step('act', 'Signals pre-empted', `${pre.junctionsCleared} junctions cleared · estimated saving ${min(pre.estimatedSavedSeconds / 60)} · window ${pre.overrideWindowS}s`);
      step('verify', 'Verification', 'Override auto-releases when the vehicle clears the last junction; cross-corridor queues return to green-wave.');
      step('learn', 'Memory updated', `Pre-emption timing tuned for corridor ${ambulance.corridorId} (mean delay ${(pre.estimatedSavedSeconds / junctions.length).toFixed(0)} s/junction).`);
      return {
        summary: `Emergency corridor cleared across ${pre.junctionsCleared} junctions (saved ~${min(pre.estimatedSavedSeconds / 60)})`,
        confidence: 0.92,
        actions: ['signal_preempt'],
        requiresApproval: false,
        metrics: { junctionsCleared: pre.junctionsCleared, savedSeconds: pre.estimatedSavedSeconds },
      };
    }

    // hotspot-prevention mode
    step('perceive', 'Hotspot sweep requested', `scanning ${junctions.length} corridor junctions for crash risk`);
    const scored = [];
    for (const j of junctions.slice(0, 4)) {
      const s = await tools.hotspot_score({ lat: j.lat, lng: j.lng });
      scored.push({ junction: j, ...s });
    }
    const worst = scored.sort((a, b) => b.score - a.score)[0];
    step('fuse', 'Risk ranking', `highest risk: ${worst.junction.name} (${worst.score}/100, school nearby: ${worst.schoolNearby})`);
    step('reason', 'Intervention choice', 'Advisory speed reduction + patrol alert beats physical works on cost per crash avoided at this stage.');
    const advisory = await tools.publish_advisory({
      corridor: 'CBE-AVINASHI',
      message: `Crash-risk alert at ${worst.junction.name} — reduce speed, expect stopped traffic`,
      severity: worst.score > 70 ? 'high' : 'medium',
    });
    step('act', 'Advisory published', `${advisory.advisoryId} → variable message signs + driver apps`);
    step('verify', 'Verification', 'Advisory acknowledged by 3 driver apps; revisit after 24h for crash/defect deltas.');
    return {
      summary: `Hotspot alert at ${worst.junction.name} (risk ${worst.score}/100)`,
      confidence: 0.81,
      actions: ['publish_advisory'],
      requiresApproval: false,
      metrics: { worstScore: worst.score },
    };
  },
};

/* ===================================================================== */
/* 3. Reroute — disruption-aware freight routing                          */
/* ===================================================================== */
const Reroute = {
  id: 'reroute',
  name: 'Reroute',
  purpose: 'Reroutes freight and buses around floods, closures and congestion, with costed trade-offs.',
  toolsUsed: ['weather_flood_alert', 'road_closure_feed', 'route_solver', 'notify_party'],
  guardrails: ['Never reroutes hazmat or overloaded vehicles without human confirmation'],

  async run({ shipment, driverId = 'D-3310', language = 'ml-IN' }, ctx) {
    const { tools, step } = ctx;
    const s = shipment;

    step('perceive', 'Weather + closure feeds polled', `shipment ${s.id} · ${s.from} → ${s.to} · ${s.tonnes} t`);
    const flood = await tools.weather_flood_alert({ region: 'thrissur' });
    const closures = await tools.road_closure_feed({ corridor: 'CBE-KOCHI' });
    step('fuse', 'Hazard correlated with route', flood.active
      ? `${flood.hazard.label} (severity ${flood.hazard.severity}, valid ${flood.hazard.validHours}h) intersects the direct route · ${closures.closures.length} closure on record`
      : 'No active hazard on the direct route.');

    const routes = await tools.route_solver({ from: s.from, to: s.to, avoid: flood.active ? [flood.hazard.id] : [] });
    const blocked = routes.options.filter((o) => !o.avoidsHazards);
    const clear = routes.options.filter((o) => o.avoidsHazards);
    const direct = routes.options.reduce((a, b) => (a.distanceKm <= b.distanceKm ? a : b));
    const diversion = clear.length ? clear.reduce((a, b) => (a.driveMinutes <= b.driveMinutes ? a : b)) : null;

    step('reason', 'Options costed', [
      `direct ${direct.via} — ${direct.distanceKm} km / ${min(direct.driveMinutes)} · hazard exposure ${direct.hazardExposure.length}`,
      diversion ? `diversion ${diversion.via} — ${diversion.distanceKm} km / ${min(diversion.driveMinutes)} · clear` : 'no clear alternative',
    ].join(' · '));

    const addedMinutes = diversion ? diversion.driveMinutes - direct.driveMinutes : 0;
    const addedKm = diversion ? diversion.distanceKm - direct.distanceKm : 0;
    step(
      'reason',
      'Recommendation',
      diversion
        ? `Take the diversion: +${addedKm} km, +${min(addedMinutes)} vs. a ${min(60 * flood.hazard.validHours)} exposure to ${flood.hazard.type}.`
        : 'Hold in place and wait for the hazard to clear.'
    );

    const choice = diversion || direct;
    step('plan', 'Plan', `Lock route via ${choice.via}; notify driver in ${language}; hand ETA to ColdGuard for shelf-life re-check.`);
    const notify = await tools.notify_party({
      party: driverId,
      shipmentId: s.id,
      message: `Route changed: take ${choice.via}. Added ${min(addedMinutes)}. Flood ahead on NH-544.`,
      channel: 'driver app + voice',
      language,
      key: 'route_change',
    });
    step('act', 'Driver notified', `${notify.channel} · ${language} · delivered ${notify.delivered}`);
    step('verify', 'Verification', `New ETA ${min(choice.driveMinutes)}; driver acknowledged.`);
    step('learn', 'Memory updated', `Flood-diversion prior for ${s.from}→${s.to}: prefer ${choice.via} when flood-thrissur is active.`);

    return {
      summary: `Rerouted via ${choice.via} (+${addedKm} km, +${min(addedMinutes)}) around ${flood.hazard?.type ?? 'closure'}`,
      confidence: 0.89,
      actions: ['route_solver', 'notify_party'],
      requiresApproval: false,
      metrics: { addedKm, addedMinutes, routeVia: choice.via, driveMinutes: choice.driveMinutes, distanceKm: choice.distanceKm },
      route: choice,
    };
  },
};

/* ===================================================================== */
/* 4. ColdGuard — spoilage prevention with shelf-life-aware routing       */
/* ===================================================================== */
const ColdGuard = {
  id: 'coldguard',
  name: 'ColdGuard',
  purpose: 'Tracks remaining shelf life and diverts cargo before it spoils.',
  toolsUsed: ['rsl_model', 'find_precooling_node', 'book_slot', 'notify_party', 'smart_contract_clause', 'anchor_proof'],
  guardrails: ['May not dispose of cargo', 'Cannot spend above the shipment cost threshold without approval'],

  async run({ shipment, telemetry, elapsedH, etaMinutes, ambientC = 33, position }, ctx) {
    const { tools, step, memory } = ctx;
    const s = shipment;

    const samples = Array.isArray(telemetry) ? telemetry : [];
    const latest = samples[samples.length - 1];
    step(
      'perceive',
      'Reefer telemetry window',
      `${samples.length} samples${latest ? ` · latest ${latest.tempC}°C` : ' · no samples supplied, treating as in-band'} · door events: ${samples.filter((t) => t.doorOpen).length}`
    );
    const rsl = await tools.rsl_model({ commodity: s.commodity, elapsedH, tempTrace: samples, ambientC });
    step('fuse', 'Shelf life recomputed', `RSL ${rsl.rslDays} d (${rsl.rslRemainingH} h) · out-of-band ${rsl.breachMinutes} min · decay ×${rsl.decayMultiplier}`);

    const tolerance = rsl.toleranceC;
    const breach = rsl.toleranceBreach;
    const etaH = etaMinutes / 60;
    const arrivesInBand = !breach && rsl.rslRemainingH > etaH;
    step(
      'reason',
      'Risk assessment',
      breach
        ? `Tolerance band ${tolerance[0]}–${tolerance[1]}°C breached — shelf life is being consumed ${rsl.decayMultiplier}× faster than plan.`
        : `Within band; RSL margin over ETA is ${(rsl.rslRemainingH - etaH).toFixed(1)} h.`
    );

    if (!breach) {
      step('plan', 'Plan', 'No intervention — continue with normal monitoring cadence.');
      step('verify', 'Verification', 'Temperature stable; next telemetry window in 15 min.');
      return { summary: `Cargo healthy — RSL ${rsl.rslDays} d`, confidence: 0.9, actions: [], requiresApproval: false, metrics: { rslDays: rsl.rslDays, risk: 0.02 } };
    }

    // Causal attribution: door event vs mechanical fault.
    const doorOpens = samples.filter((t) => t.doorOpen).length;
    const rootCause = doorOpens > 0 ? 'door left ajar at a mid-route halt (not a compressor fault)' : 'possible refrigeration fault';
    step('reason', 'Root cause', rootCause);

    const rejectionRisk = Math.min(0.95, +(0.18 + rsl.breachMinutes / 90).toFixed(2));
    const exposureInr = Math.round(s.tonnes * (s.commodity === 'vaccines' ? 9_000_000 : s.commodity === 'hill_vegetables' ? 153_000 : 420_000) * rejectionRisk);
    step('reason', 'Exposure quantified', `rejection probability ${(rejectionRisk * 100).toFixed(0)}% on cargo worth ${inr(s.tonnes * (s.commodity === 'vaccines' ? 9_000_000 : s.commodity === 'hill_vegetables' ? 153_000 : 420_000))} → ${inr(exposureInr)} at risk`);

    const near = await tools.find_precooling_node({ nearLat: position.lat, nearLng: position.lng });
    const node = near.candidates[0];
    if (!node) {
      step('reason', 'No facility reachable', 'Escalating to a human dispatcher.');
      return { summary: 'No pre-cooling node reachable — escalated', confidence: 0.6, actions: [], requiresApproval: true, approval: { reason: 'No cold-chain facility within range; cargo at risk', risk: 'financial' } };
    }

    const addedMinutes = Math.round(node.km * 1.4) + node.preCoolMinutes;
    const cost = node.costInr;
    const worthIt = cost < exposureInr * 0.6;
    step(
      'reason',
      'Intervention choice',
      `Divert to ${node.name} (+${min(addedMinutes)}, ${inr(cost)}) vs. continue (${inr(exposureInr)} exposure) → ${worthIt ? 'DIVERT' : 'continue and notify'}`
    );

    const requiresApproval = cost > (s.requiresApprovalAboveInr ?? 0);
    const actions = [];
    if (worthIt) {
      step('plan', 'Plan', `Divert → pre-cooling at ${node.name} → resume → notify buyer → update contract clause → anchor evidence.`);
      const slot = await tools.book_slot({ nodeId: node.id, shipmentId: s.id, minutes: node.preCoolMinutes });
      step('act', 'Pre-cooling slot booked', `${slot.bookingId} · ${node.preCoolMinutes} min · ${node.name}`);
      actions.push('book_slot');

      const buyer = await tools.notify_party({
        party: s.consignee,

        language: 'en-IN',

        contractId: s.contractId,

      const proof = await tools.anchor_proof({

/**
 * PulseGrid agent core — GRIDMASTER orchestrator.
 *
 * Responsibilities:
 *  - decompose a goal into an ordered set of agent tasks
 *  - dispatch agents, feeding one agent's output into the next (e.g. a new
 *    ETA from Reroute is handed to ColdGuard for a shelf-life re-check)
 *  - own policy: decide when an action needs human approval
 *  - record every step and tool call into a replayable Run
 *  - carry episodic memory across runs (learn)
 *
 * Pure JS — runs in the browser and in Node.
 */
function createRuntime({ speed = 1, onEvent = () => {} } = {}) {
  const memory = new Map();
  const runs = [];
  const approvals = [];

  const sleep = (ms) => new Promise((r) => setTimeout(r, speed > 0 ? ms * speed : 0));

  function newRun(goal, scenarioId) {
    const run = {
      id: `RUN-${String(runs.length + 1).padStart(3, '0')}`,
      scenarioId,
      goal,
      status: 'running',
      startedAt: new Date().toISOString(),
      endedAt: null,
      durationMs: 0,
      steps: [],
      toolCalls: [],
      decisions: [],
      approvals: [],
      agentResults: [],
      metrics: {},
    };
    runs.unshift(run);
    return run;
  }

  async function executeAgent(agent, goal, run, scenario) {
    const toolCalls = [];
    const ctx = {
      tools: makeToolkit(toolCalls, { onEvent, latency: 0 }),
      memory,
      step: (phase, title, detail) => {
        const s = { phase, title, detail, at: new Date().toISOString(), agent: agent.id };
        run.steps.push(s);
        onEvent({ type: 'step', runId: run.id, agent: agent.id, step: s });
      },
      emit: onEvent,
    };

    onEvent({ type: 'agent_start', runId: run.id, agent: agent.id, agentName: agent.name });
    const t0 = Date.now();
    await sleep(180);
    const result = await agent.run(goal, ctx);
    const elapsedMs = Date.now() - t0;

    run.toolCalls.push(...toolCalls);
    run.decisions.push({ agent: agent.id, summary: result.summary, confidence: result.confidence, metrics: result.metrics || {} });
    const agentResult = { agent: agent.id, agentName: agent.name, ...result, elapsedMs, toolCallCount: toolCalls.length };
    run.agentResults.push(agentResult);
    onEvent({ type: 'agent_done', runId: run.id, agent: agent.id, agentName: agent.name, result: agentResult });
    await sleep(120);
    return agentResult;
  }

  /**
   * Orchestration policy: does this agent's proposal need a human gate?
   * (agent-declared, plus orchestrator policy on spend and public-facing actions)
   */
  function evaluateApproval(agentResult) {
    if (!agentResult.requiresApproval || !agentResult.approval) return null;
    return {
      id: `APR-${approvals.length + 1}`,
      runId: null,
      agentId: agentResult.agent,
      agentName: agentResult.agentName,
      reason: agentResult.approval.reason,
      risk: agentResult.approval.risk,
      status: 'pending',
      raisedAt: new Date().toISOString(),
      resolvedAt: null,
      resolution: null,
    };
  }

  /**
   * The shared executor: runs an ordered plan of agent tasks, feeding each
   * agent's output into the next, applying the approval policy, and recording
   * everything into a replayable run.
   */
  async function executePlan({ goal, tasks, inputs = {}, label = 'custom', request = null, plan = null }) {
    const run = newRun(goal, label);
    if (request) run.request = request;
    if (plan) run.plan = { intents: plan.intents, rationale: plan.rationale, confidence: plan.confidence, needsClarification: plan.needsClarification };
    onEvent({ type: 'run_start', runId: run.id, scenarioId: label, goal, request, plan, at: run.startedAt });

    let carry = { ...inputs };

    for (const task of tasks) {
      const agent = AGENTS_BY_ID[task.agent];
      if (!agent) continue;

      // Feed forward: merge the previous agent's result into this task's inputs.
      const goalForAgent = { ...carry, ...(typeof task.input === 'function' ? task.input(carry) : task.input || {}) };

      const result = await executeAgent(agent, goalForAgent, run);

      // Carry forward the values the next agent needs.
      if (result.metrics) carry = { ...carry, ...result.metrics };
      if (result.route) carry.route = result.route;

      // Policy: spend above the shipment threshold, or public-facing actions, need a human.
      const approval = evaluateApproval(result);
      const addedCost = result.metrics?.addedKm ? result.metrics.addedKm * 34 : 0; // ₹/km for a reefer
      const shipmentThreshold = carry.shipment?.requiresApprovalAboveInr ?? Infinity;

      if (approval) {
        approval.runId = run.id;
        approvals.unshift(approval);
        run.approvals.push(approval);
        onEvent({ type: 'approval_request', runId: run.id, approval });
      } else if (addedCost > shipmentThreshold) {
        const spendApproval = {
          id: `APR-${approvals.length + 1}`,
          runId: run.id,
          agentId: 'gridmaster',
          agentName: 'GRIDMASTER',
          reason: `Diversion adds ${Math.round(addedCost)} INR in fuel/time, above the ${shipmentThreshold} INR policy threshold`,
          risk: 'financial',
          status: 'pending',
          raisedAt: new Date().toISOString(),
          resolvedAt: null,
          resolution: null,
        };
        approvals.unshift(spendApproval);
        run.approvals.push(spendApproval);
        onEvent({ type: 'approval_request', runId: run.id, approval: spendApproval });
      }

      await sleep(140);
    }

    // Aggregate outcome metrics.
    run.metrics = run.agentResults.reduce((acc, r) => ({ ...acc, ...(r.metrics || {}) }), {});
    run.status = run.approvals.some((a) => a.status === 'pending') ? 'awaiting_approval' : 'completed';
    run.endedAt = new Date().toISOString();
    run.durationMs = new Date(run.endedAt) - new Date(run.startedAt);

    onEvent({ type: 'run_end', runId: run.id, status: run.status, run });
    return run;
  }

  async function runScenario(scenarioId) {
    const scenario = SCENARIOS_BY_ID[scenarioId];
    if (!scenario) throw new Error(`Unknown scenario ${scenarioId}`);
    return executePlan({ goal: scenario.goal, tasks: scenario.tasks, inputs: scenario.inputs, label: scenarioId });
  }

  /**
   * Run the mesh from a FREE-FORM request — the entry point an API caller uses.
   * The router classifies the request, picks the agents and orders them; the
   * executor then does the work and returns the full reasoning trace.
   */
  async function runRequest({ request, context = {} } = {}) {
    const text = request || context.request || '';
    if (!text) throw new Error('A `request` string is required');
    const plan = planRequest(text, context);
    return executePlan({
      goal: text,
      tasks: plan.tasks,
      inputs: { ...context },
      label: 'request',
      request: text,
      plan,
    });
  }

  function resolveApproval(approvalId, decision, note = '') {
    const a = approvals.find((x) => x.id === approvalId);
    if (!a || a.status !== 'pending') return null;
    a.status = decision === 'approve' ? 'approved' : 'rejected';
    a.resolution = note || (decision === 'approve' ? 'Approved by operator' : 'Rejected by operator');
    a.resolvedAt = new Date().toISOString();
    const run = runs.find((r) => r.id === a.runId);
    if (run && !run.approvals.some((x) => x.status === 'pending')) {
      run.status = decision === 'approve' ? 'completed' : 'completed_with_rejection';
    }
    onEvent({ type: 'approval_resolved', approval: a });
    return a;
  }

  return {
    runScenario,
    runRequest,
    planRequest,
    resolveApproval,
    getRuns: () => runs,
    getApprovals: () => approvals,
    getMemory: () => Object.fromEntries(memory),
    agentCatalog: AGENTS.map((a) => ({
      id: a.id,
      name: a.name,
      purpose: a.purpose,
      toolsUsed: a.toolsUsed,
      guardrails: a.guardrails,
    })),
    scenarioCatalog: SCENARIOS.map((s) => ({ id: s.id, title: s.title, goal: s.goal, blurb: s.blurb })),
    intents: INTENTS,
  };
}

/**
 * @returns {Promise<{results: Array, passed: number, total: number, durationMs: number}>}
 */
async function runEvals() {
  const t0 = Date.now();
  const rt = createRuntime({ speed: 0 });
  const runs = {};
  for (const id of ['A', 'B', 'C']) {
    runs[id] = await rt.runScenario(id);
  }
  const results = SUITE.map((e) => {
    let passed = false;
    try {
      passed = Boolean(e.check(runs[e.scenario]));
    } catch {
      passed = false;
    }
    return { scenario: e.scenario, name: e.name, passed };
  });
  return {
    results,
    passed: results.filter((r) => r.passed).length,
    total: results.length,
    durationMs: Date.now() - t0,
  };
}

/**
 * Browser speech synthesis helper — reads a driver alert aloud, in the driver's
 * own language. Uses the Web Speech API, which is built into modern browsers;
 * no external service and no API key.
 *
 * If the browser has no voice for a language, the utterance is still spoken with
 * whatever the default engine offers, so the demo degrades rather than breaks.
 */
function speechSupported() {
  return typeof window !== 'undefined' && 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
}

function speak(text, lang = 'en-IN', { rate = 0.95, pitch = 1 } = {}) {
  if (!speechSupported() || !text) return false;
  try {
    const synth = window.speechSynthesis;
    synth.cancel(); // one alert at a time
    const u = new window.SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = rate;
    u.pitch = pitch;
    const voices = (synth.getVoices && synth.getVoices()) || [];
    const exact = voices.find((v) => v.lang === lang);
    const base = String(lang).split('-')[0];
    const partial = voices.find((v) => (v.lang || '').toLowerCase().startsWith(base));
    if (exact || partial) u.voice = exact || partial;
    synth.speak(u);
    return true;
  } catch {
    return false;
  }
}

function stopSpeaking() {
  if (!speechSupported()) return;
  try {
    window.speechSynthesis.cancel();
  } catch {
    /* no-op */
  }
}

  const [runs, setRuns] = useState([]);
  const [approvals, setApprovals] = useState([]);
  const [memory, setMemory] = useState({});

  const [askText, setAskText] = useState('');
  const [plan, setPlan] = useState(null);
  const [running, setRunning] = useState(false);
  const traceBoxRef = useRef(null);

  const catalog = useMemo(() => runtime.agentCatalog, [runtime]);
  const scenarios = useMemo(() => runtime.scenarioCatalog, [runtime]);

  useEffect(() => {
    const unsub = runtime.subscribe((e) => {
      switch (e.type) {
        case 'run_start':
          setTrace([]);
          setAgentStatus({});
          setAlerts([]);
          setPlan(e.plan || null);
          setRunning(true);
          setRun(null);
          break;
        case 'agent_start':
          setAgentStatus((s) => ({ ...s, [e.agent]: 'running' }));
          setTrace((t) => [...t, { kind: 'agent_start', agentName: e.agentName }]);
          break;
        case 'step':
          setTrace((t) => [...t, { kind: 'step', step: e.step }]);
          break;
        case 'tool_call':
          setTrace((t) => [...t, { kind: 'tool_call', tool: e.tool, args: e.args }]);
          break;
        case 'tool_result':
          setTrace((t) => [...t, { kind: 'tool_result', tool: e.tool, result: e.result, elapsedMs: e.elapsedMs }]);
          if (e.tool === 'notify_party' && e.result?.localized) {
            setAlerts((a) => [{ ...e.result, at: new Date().toISOString() }, ...a].slice(0, 4));
            if (autoSpeak && e.result.party && String(e.result.party).startsWith('D-')) {
              speak(e.result.localized, e.result.language);
            }
          }
          break;
        case 'agent_done':
          setAgentStatus((s) => ({ ...s, [e.agent]: 'done' }));
          setTrace((t) => [...t, { kind: 'agent_done', result: e.result }]);
          break;
        case 'approval_request':
          setApprovals((a) => [e.approval, ...a]);
          setTrace((t) => [...t, { kind: 'approval', approval: e.approval }]);
          break;
        case 'approval_resolved':
          setApprovals((a) => a.map((x) => (x.id === e.approval.id ? e.approval : x)));
          break;
        case 'run_end':
          setRun(e.run);
          setRuns(runtime.getRuns());
          setApprovals(runtime.getApprovals());
          setMemory(runtime.getMemory());
          setRunning(false);
          break;
        default:
          break;
      }
    });
    return unsub;
  }, [runtime, autoSpeak]);

  useEffect(() => {
    if (traceBoxRef.current) traceBoxRef.current.scrollTop = traceBoxRef.current.scrollHeight;
  }, [trace]);

  const changeSpeed = (v) => {
    setSpeed(v);
    setRuntime(createSubscribableRuntime({ speed: v }));

    setRuns([]);
    setApprovals([]);
    setMemory({});
    setAgentStatus({});
    setRun(null);
