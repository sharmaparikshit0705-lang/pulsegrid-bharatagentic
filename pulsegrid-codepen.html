/*  MODULE 1 — GERMANY PMS (Pavement Management System)                 */
/*  Bus dashcam + laser scanBeam defect detection, citizen reports,    */
/*  24h municipal SLA workflow, footage custody chain.                 */
/* ==================================================================== */

const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ------------------------- Dashcam simulation ------------------------- */

const TRIP = { lat0: 11.0126, lng0: 76.9643, lat1: 11.0523, lng1: 76.9204, km: 5.6 };

/**
 * Canvas-rendered bus dashcam: Avinashi Road forward view, lane dashes
 * scrolling at the live speed (kept under 60 km/h), potholes spawning in the
 * detection zone, and a sweeping cyan laser scanBeam. When the beam crosses
 * a defect inside the zone it locks a red bounding box, labels the crack
 * size and severity, and fires onDetect().
 */
function DashcamFeed({ onDetect }) {
  const canvasRef = useRef(null);
  const onDetectRef = useRef(onDetect);
  const [hud, setHud] = useState({ speed: 44, lat: TRIP.lat0, lng: TRIP.lng0, km: 0 });

  useEffect(() => {
    onDetectRef.current = onDetect;
  }, [onDetect]);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let raf;
    let last = performance.now();

    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(canvas);

    const S = {
      t: 0,
      km: 0,
      beamX: 40,
      beamDir: 1,
      dashes: [],
      potholes: [],
      nextPotholeIn: 2.2,
      hudT: 0,
      clouds: [
        { x: 0.12, y: 0.10, s: 1.0, v: 0.006 },
        { x: 0.48, y: 0.06, s: 0.7, v: 0.004 },
        { x: 0.78, y: 0.14, s: 1.2, v: 0.005 },
      ],
      // the bus ahead in our own lane (rear view) — we follow it
      leadBus: { z: 0.52, gap: 0.52, wobble: 0 },
      // oncoming traffic in the opposite lane (front view)
      oncoming: { z: 0.06, kind: 'truck', speed: 0.19 },
      poles: [],
    };
    for (const laneX of [0.36, 0.5, 0.64]) {
      for (let i = 0; i < 9; i++) S.dashes.push({ laneX, z: i / 9 });
    }
    for (let i = 0; i < 8; i++) S.poles.push({ side: i % 2 === 0 ? -1 : 1, z: i / 8 });

    /* ---------- small drawing helpers ---------- */
    const roundRect = (x, y, w, h, r) => {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    };

    /** Rear view of the bus we are following (same direction). */
    const drawLeadBus = (cx, y, wpx) => {
      const h = wpx * 1.5;
      const top = y - h;
      // shadow on the road
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(cx, y + h * 0.03, wpx * 0.55, h * 0.07, 0, 0, Math.PI * 2);
      ctx.fill();
      // body
      const grad = ctx.createLinearGradient(cx - wpx / 2, top, cx + wpx / 2, y);
      grad.addColorStop(0, '#f0b429');
      grad.addColorStop(0.45, '#f8c74a');
      grad.addColorStop(1, '#c98a12');
      ctx.fillStyle = grad;
      roundRect(cx - wpx / 2, top, wpx, h * 0.86, wpx * 0.06);
      ctx.fill();
      // livery band + rear window
      ctx.fillStyle = '#1b1b1b';
      ctx.fillRect(cx - wpx / 2, top + h * 0.30, wpx, h * 0.07);
      ctx.fillStyle = 'rgba(20,42,60,0.92)';
      roundRect(cx - wpx * 0.38, top + h * 0.10, wpx * 0.76, h * 0.17, wpx * 0.03);
      ctx.fill();
      // tail lights
      ctx.fillStyle = '#ff3b30';
      roundRect(cx - wpx * 0.44, top + h * 0.50, wpx * 0.13, h * 0.07, 2);
      ctx.fill();
      roundRect(cx + wpx * 0.31, top + h * 0.50, wpx * 0.13, h * 0.07, 2);
      ctx.fill();
      // number plate
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(cx - wpx * 0.11, top + h * 0.62, wpx * 0.22, h * 0.05);
      // wheels
      ctx.fillStyle = '#0b0b0b';
      roundRect(cx - wpx * 0.46, y - h * 0.10, wpx * 0.16, h * 0.12, 3);
      ctx.fill();
      roundRect(cx + wpx * 0.30, y - h * 0.10, wpx * 0.16, h * 0.12, 3);
      ctx.fill();
      // roof marker lights
      ctx.fillStyle = '#ffd166';
      for (let i = -2; i <= 2; i++) ctx.fillRect(cx + i * wpx * 0.11 - 1.5, top + 2, 3, 3);
    };

    /** Front view of an oncoming vehicle (opposite lane). */
    const drawOncoming = (cx, y, wpx, kind) => {
      const tall = kind === 'bus' ? 1.55 : 1.25;
      const h = wpx * tall;
      const top = y - h;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(cx, y + h * 0.03, wpx * 0.52, h * 0.06, 0, 0, Math.PI * 2);
      ctx.fill();
      const grad = ctx.createLinearGradient(cx - wpx / 2, top, cx + wpx / 2, y);
      grad.addColorStop(0, kind === 'bus' ? '#e8e8ea' : '#2f6fbf');
      grad.addColorStop(1, kind === 'bus' ? '#b9bec4' : '#1f4d86');
      ctx.fillStyle = grad;
      roundRect(cx - wpx / 2, top, wpx, h * 0.86, wpx * 0.07);
      ctx.fill();
      // windshield
      ctx.fillStyle = 'rgba(24,48,66,0.9)';
      roundRect(cx - wpx * 0.40, top + h * 0.09, wpx * 0.80, h * 0.24, wpx * 0.04);
      ctx.fill();
      // destination board for a bus
      if (kind === 'bus') {
        ctx.fillStyle = '#111';
        ctx.fillRect(cx - wpx * 0.22, top + h * 0.38, wpx * 0.44, h * 0.06);
        ctx.fillStyle = '#7fd4ff';
        ctx.fillRect(cx - wpx * 0.19, top + h * 0.40, wpx * 0.38, h * 0.025);
      }
      // headlights + grille
      ctx.fillStyle = '#fff6cf';
      roundRect(cx - wpx * 0.42, top + h * 0.56, wpx * 0.14, h * 0.08, 2);
      ctx.fill();
      roundRect(cx + wpx * 0.28, top + h * 0.56, wpx * 0.14, h * 0.08, 2);
      ctx.fill();
      ctx.fillStyle = '#22262b';
      ctx.fillRect(cx - wpx * 0.16, top + h * 0.55, wpx * 0.32, h * 0.07);
      // wheels
      ctx.fillStyle = '#0b0b0b';
      roundRect(cx - wpx * 0.46, y - h * 0.10, wpx * 0.15, h * 0.12, 3);
      ctx.fill();
      roundRect(cx + wpx * 0.31, y - h * 0.10, wpx * 0.15, h * 0.12, 3);
      ctx.fill();
    };

    const draw = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      S.t += dt;

      const speed = Math.min(58, 44 + 12 * Math.sin(S.t * 0.35));
      S.km = (S.km + (speed * dt) / 3600) % TRIP.km;
      const frac = S.km / TRIP.km;
      const lat = TRIP.lat0 + (TRIP.lat1 - TRIP.lat0) * frac;
      const lng = TRIP.lng0 + (TRIP.lng1 - TRIP.lng0) * frac;

      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const horizonY = h * 0.40;

      /* ---------- sky ---------- */
      const sky = ctx.createLinearGradient(0, 0, 0, horizonY);
      sky.addColorStop(0, '#0a1226');
      sky.addColorStop(0.55, '#16233f');
      sky.addColorStop(1, '#2b3a56');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, horizonY);

      // low sun glow
      const sun = ctx.createRadialGradient(w * 0.72, horizonY * 0.72, 4, w * 0.72, horizonY * 0.72, w * 0.28);
      sun.addColorStop(0, 'rgba(255,196,120,0.35)');
      sun.addColorStop(1, 'rgba(255,196,120,0)');
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, w, horizonY);

      // drifting clouds
      for (const c of S.clouds) {
        c.x += c.v * dt;
        if (c.x > 1.15) c.x = -0.15;
        const cx = c.x * w;
        const cy = c.y * horizonY;
        ctx.fillStyle = 'rgba(190,205,225,0.10)';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 46 * c.s, 13 * c.s, 0, 0, Math.PI * 2);
        ctx.ellipse(cx + 30 * c.s, cy + 4, 32 * c.s, 10 * c.s, 0, 0, Math.PI * 2);
        ctx.ellipse(cx - 28 * c.s, cy + 5, 26 * c.s, 9 * c.s, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      /* ---------- distant skyline + treeline ---------- */
      ctx.fillStyle = 'rgba(9,15,29,0.96)';
      [3, 7, 2, 5, 9, 4, 6, 3, 8, 5, 2, 7, 4, 6].forEach((v, i) => {
        const bw = w / 14;
        ctx.fillRect(i * bw + 2, horizonY - (10 + v * 6), bw - 5, 12 + v * 6);
      });
      ctx.fillStyle = 'rgba(12,24,20,0.9)';
      for (let i = 0; i < 22; i++) {
        const tx = (i / 22) * w + 6;
        ctx.beginPath();
        ctx.ellipse(tx, horizonY + 1, 9, 5 + (i % 3), 0, Math.PI, Math.PI * 2);
        ctx.fill();
      }

      /* ---------- road ---------- */
      const topW = w * 0.14;
      const bottomW = w * 0.96;
      const roadHalfAt = (y) => (((y - horizonY) / (h - horizonY)) ** 1.35 * (bottomW - topW) + topW) / 2;
      const yAt = (z) => horizonY + (h - horizonY) * z ** 2.1;

      // shoulder / kerb
      ctx.fillStyle = '#2a2f38';
      ctx.beginPath();
      ctx.moveTo((w - topW) / 2 - 26, horizonY);
      ctx.lineTo((w + topW) / 2 + 26, horizonY);
      ctx.lineTo((w + bottomW) / 2 + 70, h);
      ctx.lineTo((w - bottomW) / 2 - 70, h);
      ctx.closePath();
      ctx.fill();

      // asphalt
      const road = ctx.createLinearGradient(0, horizonY, 0, h);
      road.addColorStop(0, '#191f2b');
      road.addColorStop(0.5, '#222a38');
      road.addColorStop(1, '#2a3342');
      ctx.fillStyle = road;
      ctx.beginPath();
      ctx.moveTo((w - topW) / 2, horizonY);
      ctx.lineTo((w + topW) / 2, horizonY);
      ctx.lineTo((w + bottomW) / 2, h);
      ctx.lineTo((w - bottomW) / 2, h);
      ctx.closePath();
      ctx.fill();

      // asphalt grain streaks
      ctx.strokeStyle = 'rgba(255,255,255,0.028)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 26; i++) {
        const f = i / 26;
        const yy = horizonY + (h - horizonY) * f;
        const hw = roadHalfAt(yy);
        ctx.beginPath();
        ctx.moveTo(w / 2 - hw + f * hw * 0.4, yy);
        ctx.lineTo(w / 2 + hw - f * hw * 0.4, yy);
        ctx.stroke();
      }

      // edge lines
      ctx.strokeStyle = 'rgba(232,238,246,0.75)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo((w - topW) / 2 + 6, horizonY);
      ctx.lineTo((w - bottomW) / 2 + 12, h);
      ctx.moveTo((w + topW) / 2 - 6, horizonY);
      ctx.lineTo((w + bottomW) / 2 - 12, h);
      ctx.stroke();

      // centre divider — double line separating oncoming traffic
      ctx.strokeStyle = 'rgba(240,200,80,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(w / 2 - 3, horizonY);
      ctx.lineTo(w / 2 - 6, h);
      ctx.moveTo(w / 2 + 3, horizonY);
      ctx.lineTo(w / 2 + 6, h);
      ctx.stroke();

      // scrolling lane dashes
      for (const d of S.dashes) {
        d.z += dt * speed * 0.0085;
        if (d.z > 1) d.z -= 1;
        const y = yAt(d.z);
        if (y <= horizonY + 3) continue;
        const half = roadHalfAt(y);
        const x = w / 2 + (d.laneX - 0.5) * 2 * half;
        ctx.fillStyle = `rgba(232,238,246,${0.20 + d.z * 0.55})`;
        ctx.fillRect(x - 1.5 - d.z * 2, y, 3 + d.z * 5, 5 + d.z * 34);
      }

      // roadside lamp posts
      for (const p of S.poles) {
        p.z += dt * speed * 0.0085;
        if (p.z > 1) p.z -= 1;
        const y = yAt(p.z);
        if (y <= horizonY + 6) continue;
        const half = roadHalfAt(y);
        const x = w / 2 + p.side * (half + 16 + p.z * 54);
        const ph = 26 + p.z * 120;
        ctx.strokeStyle = 'rgba(120,132,148,0.75)';
        ctx.lineWidth = 1 + p.z * 2.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - ph);
        ctx.lineTo(x - p.side * (8 + p.z * 16), y - ph);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,214,140,0.85)';
        ctx.beginPath();
        ctx.arc(x - p.side * (8 + p.z * 16), y - ph + 2, 1.4 + p.z * 3.4, 0, Math.PI * 2);
        ctx.fill();
      }

      /* ---------- traffic ---------- */
      // the bus we are following (same lane, rear view)
      S.leadBus.wobble = Math.sin(S.t * 0.6) * 0.012;
      const leadZ = S.leadBus.gap + S.leadBus.wobble;
      const leadY = yAt(leadZ);
      if (leadY > horizonY + 10) {
        const half = roadHalfAt(leadY);
        drawLeadBus(w / 2 + half * 0.34, leadY, Math.max(26, 74 * leadZ + 26));
      }

      // oncoming vehicle in the opposite lane
      S.oncoming.z += dt * S.oncoming.speed;
      if (S.oncoming.z > 1.02) {
        S.oncoming.z = 0.04;
        S.oncoming.kind = Math.random() > 0.5 ? 'bus' : 'truck';
      }
      const onY = yAt(S.oncoming.z);
      if (onY > horizonY + 8) {
        const half = roadHalfAt(onY);
        drawOncoming(w / 2 - half * 0.42, onY, Math.max(20, 62 * S.oncoming.z + 22), S.oncoming.kind);
      }

      /* ---------- defects ---------- */
      S.nextPotholeIn -= dt;
      if (S.nextPotholeIn <= 0) {
        S.nextPotholeIn = rand(2.6, 5.2);
        S.potholes.push({
          laneX: pick([0.3, 0.5, 0.7]),
          z: 0.02,
          sizeCm: randInt(18, 80),
          severity: randInt(2, 5),
          detected: false,
          detectFlash: 0,
        });
      }

      S.beamPrev = S.beamX;
      S.beamX += S.beamDir * dt * w * 0.55;
      if (S.beamX > w - 6) { S.beamX = w - 6; S.beamDir = -1; }
      if (S.beamX < 6) { S.beamX = 6; S.beamDir = 1; }

      for (const p of S.potholes) {
        p.z += dt * speed * 0.0085;
        const y = yAt(p.z);
        const half = roadHalfAt(y);
        const x = w / 2 + (p.laneX - 0.5) * 2 * half;
        const rx = 3 + p.z * 26;
        const ry = rx * 0.38;

        if (y > horizonY + 4) {
          ctx.save();
          ctx.translate(x, y);
          // broken asphalt crater
          ctx.fillStyle = 'rgba(6,9,16,0.9)';
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(70,78,92,0.55)';
          ctx.beginPath();
          ctx.ellipse(0, -ry * 0.35, rx * 0.72, ry * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
          // radiating cracks
          ctx.strokeStyle = 'rgba(6,9,16,0.75)';
          ctx.lineWidth = 1 + p.z * 1.2;
          for (let i = 0; i < 5; i++) {
            const a = i * 1.28 + 0.4;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * rx * 0.85, Math.sin(a) * ry * 0.85);
            ctx.lineTo(
              Math.cos(a + 0.25) * rx * (1.7 + (i % 2) * 0.5),
              Math.sin(a + 0.25) * ry * (1.9 + (i % 2) * 0.4)
            );
            ctx.stroke();
          }
          ctx.restore();
        }

        const beamLo = Math.min(S.beamPrev ?? S.beamX, S.beamX) - 10;
        const beamHi = Math.max(S.beamPrev ?? S.beamX, S.beamX) + 10;
        if (!p.detected && p.z > 0.35 && p.z < 0.8 && x >= beamLo && x <= beamHi) {
          p.detected = true;
          p.detectFlash = S.t;
          onDetectRef.current?.({
            lat: +(lat + (Math.random() - 0.5) * 0.002).toFixed(5),
            lng: +(lng + (Math.random() - 0.5) * 0.002).toFixed(5),
            severity: p.severity,
            sizeCm: p.sizeCm,
            speedKmh: Math.round(speed),
            cameraId: 'EDGE-07',
          });
        }

        if (p.detected && S.t - p.detectFlash < 2.4) {
          const pad = Math.max(16, rx * 1.6);
          ctx.strokeStyle = '#FF3366';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.strokeRect(x - pad, y - pad * 0.55, pad * 2, pad * 1.1);
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(255,51,102,0.95)';
          ctx.font = 'bold 11px JetBrains Mono, monospace';
          ctx.fillText(`DEFECT s${p.severity} · ${p.sizeCm}cm`, x - pad, Math.max(12, y - pad * 0.55 - 6));
        }
      }
      S.potholes = S.potholes.filter((p) => p.z < 1.05);

      /* ---------- laser scanBeam ---------- */
      const beamGrad = ctx.createLinearGradient(0, horizonY, 0, h);
      beamGrad.addColorStop(0, 'rgba(0,240,255,0.04)');
      beamGrad.addColorStop(1, 'rgba(0,240,255,0.45)');
      ctx.fillStyle = beamGrad;
      ctx.fillRect(S.beamX - 7, horizonY, 14, h - horizonY);
      ctx.shadowColor = '#00F0FF';
      ctx.shadowBlur = 16;
      ctx.fillStyle = 'rgba(0,240,255,0.95)';
      ctx.fillRect(S.beamX - 1, horizonY, 2, h - horizonY);
      ctx.shadowBlur = 0;

      // scan-zone brackets
      const zy0 = yAt(0.35);
      const zy1 = yAt(0.8);
      ctx.strokeStyle = 'rgba(0,240,255,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(10, zy0); ctx.lineTo(10, zy1); ctx.lineTo(26, zy1);
      ctx.moveTo(w - 10, zy0); ctx.lineTo(w - 10, zy1); ctx.lineTo(w - 26, zy1);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,240,255,0.6)';
      ctx.font = 'bold 9px JetBrains Mono, monospace';
      ctx.fillText('SCAN ZONE 35-80 m', 28, zy1 + 3);
      ctx.textAlign = 'right';
      ctx.fillText('AI VISION ACTIVE', w - 28, zy1 + 3);
      ctx.textAlign = 'left';

      /* ---------- our own bus: bonnet + windscreen ---------- */
      const dashH = h * 0.15;
      const dash = ctx.createLinearGradient(0, h - dashH, 0, h);
      dash.addColorStop(0, '#1c2534');
      dash.addColorStop(0.35, '#0f1622');
      dash.addColorStop(1, '#080c14');
      ctx.fillStyle = dash;
      ctx.beginPath();
      ctx.moveTo(w * 0.06, h - dashH);
      ctx.quadraticCurveTo(w * 0.5, h - dashH * 1.5, w * 0.94, h - dashH);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();
      // chrome trim
      ctx.strokeStyle = 'rgba(150,170,190,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(w * 0.06, h - dashH);
      ctx.quadraticCurveTo(w * 0.5, h - dashH * 1.5, w * 0.94, h - dashH);
      ctx.stroke();
      // windscreen wiper
      ctx.strokeStyle = 'rgba(10,14,22,0.9)';
      ctx.lineWidth = 3;
      const wiperA = -0.5 + Math.sin(S.t * 0.5) * 0.42;
      ctx.beginPath();
      ctx.moveTo(w * 0.30, h - dashH * 1.15);
      ctx.lineTo(w * 0.30 + Math.cos(wiperA) * w * 0.20, h - dashH * 1.15 + Math.sin(wiperA) * h * 0.10);
      ctx.stroke();
      // windscreen reflection streak
      ctx.save();
      ctx.globalAlpha = 0.05;
      ctx.fillStyle = '#cfe6ff';
      ctx.beginPath();
      ctx.moveTo(w * 0.12, h);
      ctx.lineTo(w * 0.42, 0);
      ctx.lineTo(w * 0.56, 0);
      ctx.lineTo(w * 0.26, h);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      // bus identity plate on the bonnet
      ctx.fillStyle = 'rgba(220,230,240,0.55)';
      ctx.font = 'bold 10px JetBrains Mono, monospace';
      ctx.fillText('TN 37 · CITY BUS · EDGE-07', w * 0.06, h - dashH * 0.35);

      /* ---------- HUD publish ---------- */
      S.hudT += dt;
      if (S.hudT > 0.25) {
        S.hudT = 0;
        setHud({ speed: Math.round(speed), lat: lat.toFixed(5), lng: lng.toFixed(5), km: S.km.toFixed(2) });
      }

      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
    };
  }, []);

  return (
    <div className="relative aspect-video w-full overflow-hidden rounded-xl border border-white/10 bg-black">
      <canvas ref={canvasRef} className="h-full w-full" />

      {/* DOM HUD overlays */}
      <div className="pointer-events-none absolute inset-0 p-3 font-mono text-[11px] leading-relaxed text-cyan-100/90">
        <div className="flex items-start justify-between">
          <div className="rounded bg-black/50 px-2 py-1 backdrop-blur-sm">
            <span className="mr-2 inline-flex items-center gap-1.5 font-bold text-rose-400">
              <span className="h-2 w-2 animate-pulse rounded-full bg-rose-500" /> REC
            </span>
            EDGE-07 · TN 37 CITY BUS · AVINASHI RD
          </div>
          <div className="rounded bg-black/50 px-2 py-1 text-right backdrop-blur-sm">
            <span className={`text-lg font-bold ${hud.speed > 55 ? 'text-amber-300' : 'text-emerald-300'}`}>
              {hud.speed}
            </span>{' '}
            km/h {hud.speed < 60 ? <span className="text-emerald-400">✓ capture-eligible</span> : null}
          </div>
        </div>
        <div className="absolute bottom-3 left-3 rounded bg-black/50 px-2 py-1 backdrop-blur-sm">
          GPS {hud.lat}° N, {hud.lng}° E · chainage {hud.km} km
        </div>
        <div className="absolute bottom-3 right-3 rounded bg-black/50 px-2 py-1 backdrop-blur-sm">
          1080p · 30 fps · H.264 · geofence: CBE-AVINASHI
        </div>
      </div>
    </div>
  );
}

/* -------------------------- Citizen report ---------------------------- */

function CitizenReportForm({ onSubmitted, onToast }) {
  const [form, setForm] = useState({
    reporter: '',
    phone: '',
    notes: '',
    lat: 11.0168,
    lng: 76.9558,
    damageTypeHint: 'auto',
  });
  const [photo, setPhoto] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [vision, setVision] = useState(null);

  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const useGps = () => {
    if (!navigator.geolocation) {
      onToast('Geolocation unavailable — using Peelamedu default', 'red');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) =>
        setForm((f) => ({
          ...f,
          lat: +pos.coords.latitude.toFixed(5),
          lng: +pos.coords.longitude.toFixed(5),
        })),
      () => onToast('GPS permission denied — using Peelamedu default', 'red')
    );
  };

  const onFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      setPhoto({ name: file.name, sizeKb: Math.round(file.size / 1024), dataUrl: reader.result });
    };
    reader.readAsDataURL(file);
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!photo) {
      onToast('Attach a geotagged photo to submit (required by CCMC intake)', 'red');
      return;
    }
    setSubmitting(true);
    setVision(null);
    try {
      const res = await api.citizenReport({
        reporter: form.reporter || 'Anonymous',
        phone: form.phone,
        notes: form.notes,
        lat: +form.lat,
        lng: +form.lng,
        damageTypeHint: form.damageTypeHint === 'auto' ? undefined : form.damageTypeHint,
        hasPhoto: true,
      });
      setVision(res.vision_analysis);
      onSubmitted(res.diagnostic);
      onToast(`Report #${res.diagnostic.id} logged — 24h SLA clock started`, 'green');
    } catch (err) {
      onToast(`Submit failed: ${err.message}`, 'red');
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <form onSubmit={submit} className="space-y-3">
      <div className="grid grid-cols-2 gap-3">
        <label className="block">
          <span className="label-mono">Name</span>
          <input
            value={form.reporter}
            onChange={set('reporter')}
            placeholder="Optional"
            className="mt-1 w-full rounded-lg border border-white/10 bg-black/40 px-3 py-2 text-xs text-slate-100 outline-none focus:border-cyan-400/50"
          />
        </label>
        <label className="block">
          <span className="label-mono">Phone</span>
          <input
            value={form.phone}
            onChange={set('phone')}
            placeholder="+91 …"
            className="mt-1 w-full rounded-lg border border-white/10 bg-black/40 px-3 py-2 text-xs text-slate-100 outline-none focus:border-cyan-400/50"
          />
        </label>
      </div>

      <div className="grid grid-cols-[1fr_1fr_auto] items-end gap-2">
        <label className="block">
          <span className="label-mono">Latitude</span>
          <input
            type="number"
            step="0.00001"
            value={form.lat}
            onChange={set('lat')}
            className="mt-1 w-full rounded-lg border border-white/10 bg-black/40 px-3 py-2 font-mono text-xs text-slate-100 outline-none focus:border-cyan-400/50"
          />
        </label>
        <label className="block">
          <span className="label-mono">Longitude</span>
          <input
            type="number"
            step="0.00001"
            value={form.lng}
            onChange={set('lng')}
            className="mt-1 w-full rounded-lg border border-white/10 bg-black/40 px-3 py-2 font-mono text-xs text-slate-100 outline-none focus:border-cyan-400/50"
          />
        </label>
        <button type="button" onClick={useGps} className="btn-cyan">
          📍 Use my GPS
        </button>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <label className="block">
          <span className="label-mono">Observed damage (hint)</span>
          <select
            value={form.damageTypeHint}
            onChange={set('damageTypeHint')}
            className="mt-1 w-full rounded-lg border border-white/10 bg-black/40 px-3 py-2 text-xs text-slate-100 outline-none focus:border-cyan-400/50"
          >
            <option value="auto">Let Vision AI decide</option>
            <option>Pothole</option>
            <option>Alligator Cracking</option>
            <option>Longitudinal Cracking</option>
            <option>Edge Break</option>
            <option>Rutting</option>
          </select>
        </label>
        <label className="block">
          <span className="label-mono">Notes</span>
          <input
            value={form.notes}
            onChange={set('notes')}
            placeholder="e.g. opposite Fun Mall, left lane"
            className="mt-1 w-full rounded-lg border border-white/10 bg-black/40 px-3 py-2 text-xs text-slate-100 outline-none focus:border-cyan-400/50"
          />
        </label>
      </div>

      <div className="glass-inset flex items-center gap-3 p-3">
        {photo ? (
          <img src={photo.dataUrl} alt="report preview" className="h-16 w-24 rounded-md border border-cyan-400/30 object-cover" />
        ) : (
          <div className="flex h-16 w-24 items-center justify-center rounded-md border border-dashed border-white/15 text-[10px] text-slate-500">
            no photo
          </div>
        )}
        <div className="min-w-0 flex-1 text-xs">
          <p className="truncate text-slate-300">{photo ? photo.name : 'Attach geotagged road photo (JPG/PNG)'}</p>
          <p className="text-slate-500">
            {photo ? `${photo.sizeKb} KB · EXIF GPS auto-extracted server-side` : 'EXIF GPS extracted by the API when present'}
          </p>
        </div>
        <label className="btn-cyan cursor-pointer">
          📷 Choose
          <input type="file" accept="image/*" onChange={onFile} className="hidden" />
        </label>
      </div>

      <button type="submit" disabled={submitting} className="btn-green w-full justify-center py-2.5 text-sm">

function Module1PMS({ onToast }) {
  const [diagnostics, setDiagnostics] = useState([]);
  const [acting, setActing] = useState(false);
  const [scanning, setScanning] = useState(0);
  const loadedRef = useRef(false);

  useEffect(() => {
    if (loadedRef.current) return;
    loadedRef.current = true;
    api.getDiagnostics().then((res) => setDiagnostics(res.diagnostics));
  }, []);

  const handleDetect = useCallback(
    async (detection) => {
      setScanning((n) => n + 1);
      try {
        const res = await api.edgeScan({
          camera_id: detection.cameraId,
          bus_id: 'TN-37-BUS-2214',
          lat: detection.lat,
          lng: detection.lng,
          speed_kmh: detection.speedKmh,
          severity_hint: detection.severity,
          size_cm: detection.sizeCm,
        });
        setDiagnostics((list) => [res.diagnostic, ...list]);
        if (res.diagnostic.status === 'DISPATCHED') {
          onToast(
            `Defect #${res.diagnostic.id} (s${res.diagnostic.severity_score}) auto-dispatched → ${res.diagnostic.auto_dispatch.repair_crew}, ETA ${res.diagnostic.auto_dispatch.eta_min} min`,
            'green'
          );
        }
      } catch (e) {
        onToast(`Edge scan failed: ${e.message}`, 'red');
      }
    },
    [onToast]
  );

  const handleAction = async (id, status) => {
    setActing(true);
    try {
      const res = await api.updateDiagnosticStatus(id, status);
      setDiagnostics((list) => list.map((d) => (d.id === id ? res.diagnostic : d)));
    } catch (e) {
      onToast(`Update failed: ${e.message}`, 'red');
    } finally {
      setActing(false);
    }
  };

  const prepend = (d) => setDiagnostics((list) => [d, ...list]);

  const open = diagnostics.filter((d) => d.status !== 'REPAIRED').length;

  return (
    <section className="space-y-4">
      <SectionHeader
        index={1}
        title="Pavement Management System"
        subtitle="Bus-fleet-as-inspector: dashcam + LiDAR defect detection with 24 h municipal SLA"
      />

      <div className="grid gap-4 xl:grid-cols-2">
        <GlassCard
          title="Bus Dashcam · Live Edge Scan"
          subtitle="Front-facing camera, Avinashi Road service lane — laser scanBeam sweeping for surface defects"
          right={
            <div className="flex items-center gap-2">
              <Badge tone="cyan">scanBeam v2</Badge>
              <Badge tone={scanning > 0 ? 'green' : 'slate'}>{scanning} detections this session</Badge>
            </div>
          }
        >
          <DashcamFeed onDetect={handleDetect} />
          <div className="mt-3 grid gap-3 md:grid-cols-2">
            <PoleSensorNetwork />
            <div className="glass-inset p-3 text-xs leading-relaxed text-slate-400">
              <p className="mb-1 font-bold text-slate-100">How capture works</p>
              Frames are grabbed at 5 fps only while the bus holds below{' '}
              <b className="text-cyan-300">60 km/h</b> (above it, motion blur defeats measurement). The
              on-edge gate runs a cheap quality filter, then Vision AI scores the frame; anything
              severity ≥ 3 raises a repair ticket automatically. Watch the console for the
              POST /diagnostics/edge-scan payload each time the beam locks a defect.
            </div>
          </div>
        </GlassCard>

        <GlassCard
          title="Citizen Reporting · Geotagged Photo Intake"
          subtitle="Residents photograph damage — Vision AI grades severity, CCMC gets the ticket"
          accent="green"
        >
          <CitizenReportForm onSubmitted={prepend} onToast={onToast} />
        </GlassCard>
      </div>

      <GlassCard
        title="Defect Ledger & SLA Countdowns (24 h municipal repair window)"
        subtitle={`${open} open defects · timers escalate to the zonal officer on breach`}
        right={<Badge tone="amber">SLA 24 h</Badge>}
      >
        <div className="space-y-2">
          {diagnostics.length === 0 && (
            <p className="p-3 text-center text-xs text-slate-500">Loading diagnostics…</p>
          )}
          {diagnostics.slice(0, 8).map((d) => (

      <div className="grid gap-4 xl:grid-cols-2">

          title="Footage Custody Chain"

        </GlassCard>
        <GlassCard

          subtitle="Role-based clip retrieval with append-only audit trail — no anonymous viewing"
          accent="green"
        >
          <MunicipalAccess />
        </GlassCard>
      </div>
    </section>
  );

function nextWindowLabel(now = new Date()) {
  const h = now.getHours();
  if (h < 7) return 'opens 07:00 today';
  if (h < 10) return 'closes 10:00';
  if (h < 14) return 'opens 14:00 today';
  if (h < 17) return 'closes 17:00';
  return 'opens 07:00 tomorrow';
}

function GreenLaneStrip({ active }) {
  const [lanes, setLanes] = useState(3);
  // Green lanes sit on the OUTER (corner) lanes, never in the middle.
  const greenIndexes = lanes === 3 ? [0, 2] : [0, 3];
  const laneH = 100 / lanes;

  const traffic = {
    3: [
      { lane: 0, glyph: '🚌', dur: 9, delay: '0s', green: true },
      { lane: 1, glyph: '🚗', dur: 7, delay: '1.2s', green: false },
      { lane: 2, glyph: '🚌', dur: 10, delay: '3.4s', green: true },
    ],
    4: [
      { lane: 0, glyph: '🚌', dur: 9, delay: '0s', green: true },
      { lane: 1, glyph: '🚗', dur: 7, delay: '1.1s', green: false },
      { lane: 2, glyph: '🏍️', dur: 6, delay: '2.3s', green: false },
      { lane: 3, glyph: '🚌', dur: 11, delay: '3.8s', green: true },
    ],
  }[lanes];

  return (
    <div>
      {/* layout + status controls */}
      <div className="mb-2 flex flex-wrap items-center gap-2">
        <span className="label-mono">corridor layout</span>
        {[3, 4].map((n) => (
          <button
            key={n}
            type="button"
            onClick={() => setLanes(n)}
            className={`rounded-md border px-2 py-0.5 font-mono text-[10px] transition ${
              lanes === n
                ? 'border-cyan-400/60 bg-cyan-400/15 text-cyan-200'
                : 'border-white/10 text-slate-400 hover:text-slate-200'
            }`}
          >
            {n} lanes
          </button>
        ))}
        <span
          className={`ml-auto rounded-lg border px-2.5 py-1 font-mono text-[10px] font-bold tracking-wider ${
            active
              ? 'border-emerald-400/50 bg-emerald-400/10 text-emerald-300 animate-pulse'
              : 'border-white/15 bg-black/40 text-slate-400'
          }`}
        >
          {active ? '● GREEN LANE ACTIVE' : '○ GREEN LANE STANDBY'}
        </span>
      </div>

      {/* the road */}
      <div className="relative h-44 overflow-hidden rounded-xl border border-white/10">
        {/* asphalt */}
        <div className="absolute inset-0 bg-gradient-to-b from-[#0a0f1c] via-[#0d1526] to-[#0a0f1c]" />

        {/* lanes */}
        {Array.from({ length: lanes }).map((_, i) => {
          const isGreen = greenIndexes.includes(i);
          const top = i * laneH;
          return (
            <div key={i} className="absolute inset-x-0 overflow-hidden" style={{ top: `${top}%`, height: `${laneH}%` }}>
              {isGreen && (
                <>
                  <div
                    className={`absolute inset-0 transition-all duration-500 ${
                      active
                        ? 'bg-gradient-to-r from-emerald-400/30 via-emerald-400/10 to-emerald-400/30'
                        : 'bg-emerald-400/[0.07]'
                    }`}
                  />
                  <div
                    className="absolute inset-0"
                    style={{
                      backgroundImage:
                        'repeating-linear-gradient(75deg, rgba(0,255,102,0.20) 0 14px, transparent 14px 44px)',
                      animation: active ? 'lane-flow 2.4s linear infinite' : 'none',
                      opacity: active ? 1 : 0.35,
                    }}
                  />
                  <div
                    className={`absolute inset-x-0 top-0 h-[3px] ${
                      active ? 'bg-emerald-400 shadow-[0_0_14px_rgba(0,255,102,0.9)]' : 'bg-emerald-400/30'
                    }`}
                  />
                  <div
                    className={`absolute inset-x-0 bottom-0 h-[3px] ${
                      active ? 'bg-emerald-400 shadow-[0_0_14px_rgba(0,255,102,0.9)]' : 'bg-emerald-400/30'
                    }`}
                  />
                </>
              )}

              {/* lane label */}
              <span
                className={`absolute left-2 top-1/2 z-10 -translate-y-1/2 rounded-sm bg-black/40 px-1.5 py-0.5 font-mono text-[9px] font-bold uppercase tracking-widest backdrop-blur-sm transition-colors duration-500 ${
                  isGreen
                    ? active
                      ? 'neon-text-green shadow-[0_0_16px_rgba(0,255,102,0.35)]'
                      : 'text-emerald-400/90'
                    : 'font-normal text-slate-500'
                }`}
              >
                Lane {i + 1} · {isGreen ? `GREEN LANE — ${active ? 'buses only' : 'standby'}` : 'mixed traffic'}
              </span>
            </div>
          );
        })}

        {/* dashed lane dividers between lanes */}
        {Array.from({ length: lanes - 1 }).map((_, i) => (
          <div
            key={`div-${i}`}
            className="absolute inset-x-0 h-px"
            style={{
              top: `${(i + 1) * laneH}%`,
              background:
                'repeating-linear-gradient(90deg, rgba(148,163,184,0.30) 0 26px, transparent 26px 46px)',
            }}
          />
        ))}

        {/* traffic on every lane — buses only ever on the green lanes */}
        {traffic.map((v, i) => (
          <div
            key={`v-${i}`}
            className="absolute left-[-46px] flex items-center"
            style={{
              top: `${v.lane * laneH}%`,
              height: `${laneH}%`,
              animation: `lane-drive ${v.dur}s linear infinite`,
              animationDelay: v.delay,

            <span
              className={`text-xl ${
                v.green
                  ? active
                    ? 'drop-shadow-[0_0_10px_rgba(0,255,102,0.65)]'
                    : 'opacity-45'
                  : 'opacity-60'
              }`}
            >
              {v.glyph}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

  useEffect(() => {
    const id = setInterval(() => setRemaining((r) => Math.max(0, r - 1)), 1000);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="glass-inset flex gap-3 p-3">
      <SignalHead phase={s.current_phase} />
      <div className="min-w-0 flex-1">
        <div className="flex items-center justify-between gap-2">

        </div>
      </div>
    </div>
  );

function Module2ITS({ onToast }) {
  const [signals, setSignals] = useState([]);
  const [violations, setViolations] = useState([]);
  const [fleet, setFleet] = useState([]);
  const [laneActive, setLaneActive] = useState(isGreenLaneWindow());
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    api.getSignals().then((r) => setSignals(r.signals));
    api.getGreenLaneViolations().then((r) => setViolations(r.violations));
    api.getFleet().then((r) => setFleet(r.fleet.filter((b) => b.bus_type === 'COLLEGE_BUS')));
    const laneTimer = setInterval(() => setLaneActive(isGreenLaneWindow()), 30_000);
    const poll = setInterval(() => api.getSignals().then((r) => setSignals(r.signals)), 5000);
    return () => {
      clearInterval(laneTimer);
      clearInterval(poll);
    };
  }, []);

  const withSignal = (junctionId, updated) =>
    setSignals((list) => list.map((s) => (s.signal_id === junctionId ? updated : s)));

  const extend = async (id, seconds) => {
    setBusy(true);
    try {
      const r = await api.extendGreen(id, seconds);
      withSignal(id, r.signal);
      onToast(`${id}: green extended +${r.applied_extension_s}s (transit priority)`, 'green');
    } catch (e) {
      onToast(e.message, 'red');
    } finally {
      setBusy(false);
    }
  };

  const cycle = async (id) => {
    setBusy(true);
    try {
      const r = await api.cyclePhase(id);
      withSignal(id, r.signal);
    } catch (e) {
      onToast(e.message, 'red');
    } finally {
      setBusy(false);
    }
  };

  const sweep = async () => {
    setBusy(true);
    try {
      const r = await api.sweepGreenLane();
      const list = await api.getGreenLaneViolations();
      setViolations(list.violations);
      onToast(`Lane check complete: ${r.new_violations.length} non-compliant vehicle${r.new_violations.length === 1 ? '' : 's'} flagged for review · ₹${r.total_fines_today.toLocaleString('en-IN')} in notices today`, 'red');
    } catch (e) {
      onToast(e.message, 'red');
    } finally {
      setBusy(false);
    }
  };

  const dispatch = async (busId) => {
    setBusy(true);
    try {
      const r = await api.dispatchBus(busId);
      setFleet((list) => list.map((b) => (b.bus_id === busId ? r.bus : b)));
      onToast(`${busId} dispatched — green lane authorization live`, 'green');
    } catch (e) {
      onToast(e.message, 'red');
    } finally {
      setBusy(false);
    }
  };

  const totalFines = violations.length * 2000;

  const corridorStats = useMemo(() => {
    if (!signals.length) return { vehicles: 0, speed: 0 };
    return {
      vehicles: signals.reduce((a, s) => a + s.vehicle_count, 0),
      speed: (signals.reduce((a, s) => a + s.avg_speed_kmh, 0) / signals.length).toFixed(1),
    };
  }, [signals]);

  return (
    <section className="space-y-4">
      <SectionHeader
        index={2}
        title="Intelligent Transportation Systems"
        subtitle="Virtual green lanes, adaptive signal control & camera-enforced bus priority"
      />

      <div className="grid gap-4 xl:grid-cols-2">
        <GlassCard
          title="Virtual Green Lane — College & School Buses"
          subtitle={`Active windows 07:00–10:00 and 14:00–17:00 · ${nextWindowLabel()}`}
          accent="green"
          right={
            <Badge tone={laneActive ? 'green' : 'slate'}>
              {laneActive ? '● live now' : 'standby'}
            </Badge>
          }
        >
          <GreenLaneStrip active={laneActive} />
          <div className="mt-3 grid grid-cols-2 gap-3 md:grid-cols-4">
            <Stat label="authorized vehicles" value={fleet.length} tone="green" />
            <Stat label="lane length" value="11.2" unit="km" />
            <Stat label="avg bus gain" value="9.4" unit="min" tone="green" />
            <Stat label="lane compliance" value="97" unit="%" tone="green" />
          </div>
          <p className="mt-3 text-[11px] leading-relaxed text-slate-400">
            Between the two windows the lane reverts to mixed traffic automatically — the lane is{' '}
            <b className="text-emerald-300">virtual</b>, enforced by roadside AI cameras and bus-borne
            transponders rather than paint or barriers, so it can follow demand term-by-term.
          </p>
        </GlassCard>

        <GlassCard
          title="Green Lane Violations — Automated ₹2,000 Notices"
          subtitle="Side-mounted AI cameras match number plates against the authorization list"
          accent="red"
          right={
            <button type="button" onClick={sweep} disabled={busy} className="btn-red">
              {busy ? '⟳ scanning…' : 'Run AI Camera Sweep'}
            </button>
          }
        >
          <div className="mb-3 grid grid-cols-2 gap-3">
            <Stat label="fines issued today" value={violations.length} tone="red" />
            <Stat label="amount levied" value={`₹${totalFines.toLocaleString('en-IN')}`} tone="red" />
          </div>
          <div className="max-h-[240px] space-y-2 overflow-y-auto pr-1">
            {violations.slice(0, 8).map((v) => (
              <div key={v.id} className="glass-inset flex flex-wrap items-center gap-x-3 gap-y-1 p-2.5 text-[11px]">
                <span className="rounded bg-black/50 px-2 py-0.5 font-mono font-bold text-rose-300">{v.vehicle_reg}</span>
                <span className="text-slate-300">{v.vehicle_type}</span>
                <span className="text-slate-500">{v.label.split('·')[0]} · {v.camera_id}</span>
                <span className="ml-auto text-slate-500">{timeAgo(v.detected_at)}</span>
                <span className="font-mono font-bold text-amber-300">₹2,000</span>
                <Badge tone="red">{v.status}</Badge>
              </div>
            ))}
            {violations.length === 0 && (
              <p className="p-4 text-center text-xs text-slate-500">No violations — corridor is compliant.</p>
            )}
          </div>
          <p className="mt-2 text-[10px] leading-relaxed text-slate-500">
            Each notice stores the 12-second evidence clip and the plate match confidence. Owners
            can contest via the CCMC portal; clips are kept under the same 30-day custody chain as
            road-damage footage.
          </p>
        </GlassCard>
      </div>

      <GlassCard
        title="Adaptive Traffic Signals — Avinashi & Saravanampatti Corridors"
        subtitle="Green-wave coordination with transit-priority extension; click a junction to act on it"
        right={
          <div className="flex items-center gap-2">
            <Badge tone="cyan">corridor sync +12s offsets</Badge>
            <Badge tone="green">{corridorStats.vehicles} vehicles tracked</Badge>
          </div>
        }
      >
        <div className="grid gap-3 md:grid-cols-2 2xl:grid-cols-4">
          {signals.map((s) => (
            <SignalCard key={s.signal_id} s={s} onExtend={extend} onCycle={cycle} busy={busy} />
          ))}
          {signals.length === 0 && (
            <p className="p-4 text-center text-xs text-slate-500">Syncing signal controllers…</p>
          )}
        </div>
      </GlassCard>

      <GlassCard
        title="College Bus Dispatch Board — Live Side-Camera Feeds"
        subtitle="Every authorized bus carries dual side-mounted cameras streaming to the corridor AI"
        accent="green"
      >
        <div className="grid gap-3 md:grid-cols-2 2xl:grid-cols-3">
          {fleet.map((bus) => (
            <div key={bus.bus_id} className="glass-inset p-3">
              <div className="mb-2 flex items-center justify-between gap-2">
                <div>
                  <p className="text-xs font-bold text-slate-100">{bus.bus_id}</p>
                  <p className="font-mono text-[10px] text-slate-500">
                    {bus.route_code} · {bus.serve}
                  </p>
                </div>
                <Badge tone={bus.status === 'EN ROUTE' ? 'green' : bus.status === 'AT CAMPUS' ? 'cyan' : 'slate'}>
                  {bus.status}
                </Badge>
              </div>
              <CollegeBusSVG label="COLLEGE BUS" />
              <div className="mt-2 grid grid-cols-2 gap-2">
                <LiveFeedTile label={`${bus.bus_id} · CAM-SIDE-L`} />
                <LiveFeedTile label={`${bus.bus_id} · CAM-SIDE-R`} />
              </div>
              <div className="mt-2.5">
                <ProgressBar value={bus.occupancy_percentage} label="Occupancy" />
                <div className="mt-2 flex items-center justify-between">
                  <span className="font-mono text-[10px] text-slate-500">
                    GPS {bus.current_lat}, {bus.current_lng} · green-lane authorized
                  </span>
                  {bus.status !== 'EN ROUTE' && (
                    <button type="button" disabled={busy} onClick={() => dispatch(bus.bus_id)} className="btn-green">
                      Dispatch
                    </button>
                  )}
                </div>
              </div>
            </div>
          ))}
        </div>
      </GlassCard>
    </section>
  );
}

function Module3DRT({ onToast }) {
  const [buses, setBuses] = useState([]);
  const [hubs, setHubs] = useState([]);
  const [recommendation, setRecommendation] = useState(null);
  const [recalculating, setRecalculating] = useState(false);
  const [lastComputedAt, setLastComputedAt] = useState(null);

  useEffect(() => {
    api.getFleet().then((r) => {
      setBuses(r.fleet.filter((b) => b.bus_type === 'PUBLIC_EV'));
      setHubs(r.waiting_at_hubs);
    });
  }, []);

  const recalculate = async () => {
    setRecalculating(true);
    setRecommendation(null);
    try {
      const r = await api.recalculateCapacity('PG-EV-LOOP');
      setBuses(r.buses);
      setHubs(r.waiting_at_hubs);
      setRecommendation({
        text: r.recommendation,
        absorbed: r.passengers_absorbed,
        at: formatTime(r.computed_at),
      });
      setLastComputedAt(r.computed_at);
      onToast(
        `Route capacity recalculated — ${r.passengers_absorbed} waiting passengers absorbed into the loop`,
        'green'
      );
    } catch (e) {
      onToast(`Recalculation failed: ${e.message}`, 'red');
    } finally {
      setRecalculating(false);
    }
  };

  const totalWaiting = hubs.reduce((a, h) => a + h.waiting, 0);
  const avgOccupancy = buses.length
    ? Math.round(buses.reduce((a, b) => a + b.occupancy_percentage, 0) / buses.length)
    : 0;

  return (
    <section className="space-y-4">
      <SectionHeader
        index={3}
        title="Demand-Responsive Transit"
        subtitle="On-demand EV micro-fleet, live capacity recalculation & U-turn-first safety policy"
      />

      <div className="grid gap-4 xl:grid-cols-3">
        <GlassCard
          className="xl:col-span-2"
          title="On-Demand EV Fleet — PG-EV-LOOP"
          subtitle="App-hailed loop service: Saravanampatti IT parks ↔ Avinashi Rd ↔ city centre"
          right={
            <button
              type="button"
              onClick={recalculate}
              disabled={recalculating}
              className={recalculating ? 'btn-cyan animate-pulse' : 'btn-green'}
            >
              {recalculating ? '⟳ recalculating…' : '⟲ Recalculate Route Capacity'}
            </button>
          }
        >
          <div className="mb-3 grid grid-cols-3 gap-3">
            <Stat label="EV buses on loop" value={buses.length} tone="green" />
            <Stat label="avg occupancy" value={avgOccupancy} unit="%" tone={avgOccupancy > 80 ? 'red' : 'green'} />
            <Stat label="waiting at hubs" value={totalWaiting} tone={totalWaiting > 60 ? 'red' : 'cyan'} />
          </div>

          <div className="grid gap-3 md:grid-cols-2">
            {buses.map((b) => (
              <BusCapacityCard key={b.bus_id} bus={b} />
            ))}
            {buses.length === 0 && (
              <p className="p-4 text-center text-xs text-slate-500">Loading fleet telemetry…</p>
            )}
          </div>

          {recommendation && (
            <div className="mt-3 rounded-xl border border-emerald-400/30 bg-emerald-400/[0.06] p-3 text-xs leading-relaxed text-emerald-100">
              <span className="label-mono mb-1 block text-emerald-300">Recalculated @ {recommendation.at}</span>
              {recommendation.text}
            </div>
          )}
          {lastComputedAt === null && (
            <p className="mt-3 text-[10px] text-slate-500">
              Recalculation pulls app-hail requests, hub queue counts and live GPS headway, then rebalances
              the loop — the same POST /transit/fleet/PG-EV-LOOP/recalculate-capacity call the backend exposes.
            </p>
          )}
        </GlassCard>

        <GlassCard
          title="Hub Waiting Queues"
          subtitle="Demand signals feeding the recalculation engine"
          accent="cyan"
        >
          <div className="space-y-3">
            {hubs.map((h) => (
              <div key={h.hub}>
                <ProgressBar
                  value={Math.min(100, h.waiting * 2.5)}
                  label={h.hub}
                  warn={80}
                  sub={`${h.waiting} waiting`}
                />
              </div>
            ))}
          </div>
          <div className="glass-inset mt-4 p-3 text-[11px] leading-relaxed text-slate-400">
            <p className="mb-1 font-bold text-slate-100">How DRT dispatch works</p>
            Riders book via app/call-centre (no fixed timetable). When a hub queue exceeds the
            surge threshold, the recalculation engine reshuffles the loop and, if needed, releases
            the reserve bus from the Ukkadam depot — the proven demand-responsive pattern, electrified.
          </div>
        </GlassCard>
      </div>

      <GlassCard
        title="U-Turn Safety Policy — Right Turns Replaced Every 2–5 km"
        subtitle="Indirect right-turn design with U-turns: fewer crossing conflicts, predictable headways"
        accent="green"
        right={<Badge tone="green">conflict points −64%</Badge>}
      >
        <RouteSafetyStrip />
        <div className="mt-4 grid grid-cols-2 gap-3 md:grid-cols-4">
          <Stat label="avg U-turn interval" value="2.9" unit="km" tone="green" />
          <Stat label="right-turn exposure" value="−64" unit="%" tone="green" />
          <Stat label="corridor delay saved" value="18" unit="%" tone="green" />
          <Stat label="collisions avoided / yr (proj.)" value="31" tone="red" />
        </div>
        <p className="mt-3 text-[11px] leading-relaxed text-slate-400">
          Crossing right turns is the dominant fatal-crash mechanism on Indian arterial roads. PulseGrid
          physically replaces direct right turns with U-turns staggered every 2–5 km, and the same rule
          governs DRT routing: the loop only ever turns right via a U-turn pocket, which keeps EV
          headways predictable and removes unprotected crossings from every bus journey.
        </p>
      </GlassCard>
    </section>
  );
}

const PULSEGRID_OPTIMIZED = [23, 27, 26, 20, 19, 20, 21, 22, 23, 25, 28, 27, 23, 19, 15];

function Analytics() {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {

    const cyanFill = ctx.createLinearGradient(0, 0, 0, 320);

    chartRef.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: HOURS,
        datasets: [
          {
            label: 'Baseline peak-hour delay',
            data: BASELINE_DELAY,
            borderColor: '#FF3366',
            backgroundColor: cyanFill,
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: '#FF3366',
            tension: 0.35,
            fill: true,
          },
          {

            borderColor: '#00FF66',
            backgroundColor: greenFill,
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: '#00FF66',
            tension: 0.35,
            fill: true,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            labels: { color: '#94a3b8', usePointStyle: true, boxWidth: 8, font: { size: 11 } },
          },
          tooltip: {
            backgroundColor: 'rgba(7,11,20,0.92)',
            borderColor: 'rgba(0,240,255,0.35)',
            borderWidth: 1,
            titleColor: '#e2e8f0',
            bodyColor: '#cbd5e1',
            padding: 10,
            callbacks: {
              label: (c) => `${c.dataset.label}: ${c.parsed.y} min`,
              afterBody: (items) => {
                const i = items[0].dataIndex;
                return `saved: ${BASELINE_DELAY[i] - PULSEGRID_OPTIMIZED[i]} min`;
              },
            },
          },
        },
        scales: {
          x: { grid: { color: 'rgba(148,163,184,0.08)' }, ticks: { color: '#64748b', font: { size: 10 } } },
          y: {
            beginAtZero: true,
            grid: { color: 'rgba(148,163,184,0.08)' },
            ticks: { color: '#64748b', font: { size: 10 }, callback: (v) => `${v}m` },
          },
        },
      },
    });
    return () => {
      if (chartRef.current) chartRef.current.destroy();
    };
  }, []);

  const totalBase = BASELINE_DELAY.reduce((a, b) => a + b, 0);
  const totalOpt = PULSEGRID_OPTIMIZED.reduce((a, b) => a + b, 0);
  const avgSaved = ((totalBase - totalOpt) / BASELINE_DELAY.length).toFixed(1);
  const peakSaved = Math.max(...BASELINE_DELAY.map((v, i) => v - PULSEGRID_OPTIMIZED[i]));

  return (
    <section className="space-y-4">
      <SectionHeader
        index="4"
        title="Corridor Analytics — PulseGrid vs Baseline"
        subtitle="Avinashi Rd ↔ Saravanampatti end-to-end travel time by hour of day"
      />
      <GlassCard
        title="Peak-Hour Delay vs PulseGrid Optimized Travel Time"
        subtitle="Hover any hour point for per-hour savings — 30-day rolling model, both corridors"
        right={<Badge tone="green">avg −32%</Badge>}
      >
        <div className="relative h-[340px]">
          <canvas ref={canvasRef} />
        </div>
        <div className="mt-4 grid grid-cols-2 gap-3 md:grid-cols-4">
          <Stat label="avg time saved / trip" value={`−${avgSaved}`} unit="min" tone="green" />
          <Stat label="peak saving (worst hour)" value={`−${peakSaved}`} unit="min" tone="green" />
          <Stat label="on-time college arrivals" value="94.2" unit="%" tone="green" />
          <Stat label="signal stops per trip" value="−5.1" tone="cyan" />
        </div>
      </GlassCard>
    </section>
  );
}

/* Live context ticker — the problem statement, always on screen. */
const TICKER = [
  { k: 'ROAD SAFETY', v: '1,77,175 deaths on Indian roads in 2024', tone: 'red' },
  { k: 'AGENT MESH', v: '8 specialist agents · 23 instrumented tools', tone: 'cyan' },
  { k: 'COLD CHAIN', v: '6–15% of fruit & vegetables lost before sale', tone: 'amber' },
  { k: 'LOGISTICS', v: '7.97% of GDP — ₹24 lakh crore a year', tone: 'cyan' },
  { k: 'EMERGENCY', v: '20 road deaths every hour', tone: 'red' },
  { k: 'PUBLIC RAILS', v: 'ULIP: 142 APIs across 12 ministries', tone: 'green' },
  { k: 'SCENARIOS', v: 'flood reroute · spoilage save · emergency corridor', tone: 'cyan' },
  { k: 'OPEN SOURCE', v: 'MIT licensed · deployable by any municipality', tone: 'green' },
];

function Ticker() {
  const items = [...TICKER, ...TICKER];
  const toneCls = {
    cyan: 'text-cyan-300',
    green: 'text-emerald-300',
    red: 'text-rose-300',
    amber: 'text-amber-300',
  };
  return (
    <div className="relative overflow-hidden rounded-xl border border-white/10 bg-white/[0.03] py-2 backdrop-blur-xl">
      <div className="pointer-events-none absolute inset-y-0 left-0 z-10 w-16 bg-gradient-to-r from-[#070B14] to-transparent" />
      <div className="pointer-events-none absolute inset-y-0 right-0 z-10 w-16 bg-gradient-to-l from-[#070B14] to-transparent" />
      <div className="ticker-track gap-8 px-6">
        {items.map((t, i) => (
          <span key={i} className="flex shrink-0 items-center gap-2 whitespace-nowrap text-[11px]">
            <span className={`font-mono text-[10px] font-bold tracking-wider ${toneCls[t.tone]}`}>{t.k}</span>
            <span className="text-slate-500">·</span>
            <span className="text-slate-300">{t.v}</span>
          </span>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [emergencyActive, setEmergencyActive] = useState(false);
  const [resetKey, setResetKey] = useState(0);
  const [busy, setBusy] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = useCallback((msg, tone = 'cyan') => {
    setToast({ msg, tone, at: Date.now() });
    setTimeout(() => setToast(null), 3800);
  }, []);

  const handleEmergencyOverride = useCallback(async () => {
    setBusy(true);
    try {
      if (!emergencyActive) {
        await api.emergencyOverride({ junctionIds: 'ALL', reason: 'Operator-initiated corridor override' });
        setEmergencyActive(true);
        showToast('EMERGENCY OVERRIDE engaged — all junctions flushed to corridor hold', 'red');
      } else {
        await api.emergencyOverride({ active: false });
        setEmergencyActive(false);
        showToast('Emergency override stood down — green wave restored', 'green');
      }
    } catch (e) {
      showToast(`Override failed: ${e.message}`, 'red');
    } finally {
      setBusy(false);
    }
  }, [emergencyActive, showToast]);

  const handleReset = useCallback(async () => {
    setBusy(true);
    try {
      api.resetAll();
      setEmergencyActive(false);
      setResetKey((k) => k + 1);
      showToast('Simulation reset — all modules restored to seed state', 'cyan');
    } finally {
      setBusy(false);
    }
  }, [showToast]);

  return (
    <div className="relative min-h-screen pb-16">
      {/* ---------- animated background ---------- */}
      <div className="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
        <div className="absolute inset-0 grid-bg opacity-70" />
        <div className="aurora-blob left-[-10%] top-[-8%] h-[420px] w-[420px] bg-cyan-500/25" />
        <div className="aurora-blob right-[-8%] top-[18%] h-[380px] w-[380px] bg-emerald-500/20" style={{ animationDelay: '-7s' }} />
        <div className="aurora-blob left-[35%] bottom-[-12%] h-[440px] w-[440px] bg-violet-600/15" style={{ animationDelay: '-14s' }} />
        <div className="absolute inset-0 bg-gradient-to-b from-transparent via-[#070B14]/40 to-[#070B14]" />
      </div>

      <Header
        aiOnline
        emergencyActive={emergencyActive}
        onEmergencyOverride={handleEmergencyOverride}
        onReset={handleReset}
        busy={busy}
      />

      {/* Emergency banner */}
      {emergencyActive && (
        <div className="fixed inset-x-0 top-[68px] z-40 border-y border-rose-500/40 bg-rose-500/10 backdrop-blur-md">
          <p className="py-1.5 text-center font-mono text-xs font-bold tracking-[0.3em] text-rose-300 animate-pulse">
            🚨 EMERGENCY OVERRIDE IN EFFECT · CORRIDOR JUNCTIONS HELD · PRIORITY & EMERGENCY VEHICLES ONLY 🚨
          </p>
        </div>
      )}

      <main className={`mx-auto max-w-[1500px] space-y-8 px-4 ${emergencyActive ? 'pt-32' : 'pt-24'}`}>
        <Ticker />
        <AgenticPlane key={`m0-${resetKey}`} onToast={showToast} />
        <Module1PMS key={`m1-${resetKey}`} onToast={showToast} />
        <Module2ITS key={`m2-${resetKey}`} onToast={showToast} />
        <Module3DRT key={`m3-${resetKey}`} onToast={showToast} />
        <Analytics key={`m4-${resetKey}`} />
      </main>

      <footer className="mx-auto mt-12 max-w-[1500px] px-4 text-center">
        <p className="text-[11px] leading-relaxed text-slate-500">
          PulseGrid · Agentic Mobility &amp; Logistics Intelligence for Bharat · Avinashi Road &amp;
          Saravanampatti IT/College corridors, Coimbatore · built for the{' '}
          <span className="text-cyan-400">Bharat Agentic-AI Hackathon 2026</span> · open source (MIT) ·
          every feed, detection, fine and agent action shown here is simulated and labelled as such.
        </p>
      </footer>

      {/* Toast */}
      {toast && (
        <div
          className={`glass fixed bottom-6 left-1/2 z-50 -translate-x-1/2 px-4 py-2.5 text-xs font-semibold ${
            toast.tone === 'red'
              ? 'border-rose-500/40 text-rose-200'
              : toast.tone === 'green'
              ? 'border-emerald-400/40 text-emerald-200'
              : 'border-cyan-400/40 text-cyan-200'
          }`}
        >
          {toast.msg}
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(
  <React.StrictMode>
    <App />
  </React.StrictMode>
);
/*__APP_END__*/
</script>
</body>
</html>
